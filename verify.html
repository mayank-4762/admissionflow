<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify your email — AdmissionFlow</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#111827}.wrap{max-width:640px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px}button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:0;margin-top:10px;font:inherit;font-weight:700;background:#4f46e5;color:#fff}.secondary{background:#eef2ff;color:#3730a3}.msg{margin-top:14px}.err{color:#b42318}.ok{color:#067647}.muted{color:#667085}a{color:#4f46e5}</style></head><body><main class="wrap"><section class="card"><h1>Verify your email</h1><p>Open the verification email we sent you. After you click it, return here and continue.</p><button id="verified">I verified my email</button><button id="resend" class="secondary">Resend verification email</button><p id="msg" class="msg"></p><p><a href="/login">Back to login</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>(()=>{const msg=document.getElementById('msg');const pendingKey='admissionflow_pending_signup_v4';const set=(t,c='')=>{msg.textContent=t;msg.className='msg '+c};const fail=e=>set(e?.message||String(e),'err');const start=async()=>{try{if(!window.supabase?.createClient)throw Error('Authentication service could not be loaded. Please refresh the page.');const db=window.supabase.createClient('https://tdzqkygwrdqqpjwculmf.supabase.co','sb_publishable__ITeCtWl3mFC7sqU0JlJvA_GkFUHRXl',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});window.admissionflowDb=db;document.getElementById('verified').onclick=async()=>{try{const {data,error}=await db.auth.getUser();if(error)throw error;if(!data.user?.email_confirmed_at){set('Email is not verified yet. Open the verification email first.','err');return}const p=JSON.parse(localStorage.getItem(pendingKey)||'{}');if(!p.name)throw Error('Verified, but the pending institute details are missing. Please create the account again.');const r=await db.rpc('create_institute_v3',{p_name:p.name});if(r.error)throw r.error;localStorage.removeItem(pendingKey);set('Institute created. Opening your dashboard…','ok');location.href='/dashboard'}catch(e){fail(e)}};document.getElementById('resend').onclick=async()=>{try{const p=JSON.parse(localStorage.getItem(pendingKey)||'{}');if(!p.email)throw Error('No pending signup found. Please start again.');const {error}=await db.auth.resend({type:'signup',email:p.email,options:{emailRedirectTo:location.origin+'/verify'}});if(error)throw error;set('Verification email sent again. Check your inbox.','ok')}catch(e){fail(e)}}}catch(e){fail(e)}};start()})();</script></body></html>
