name: Fix FlowForge assessment form

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch assessment endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text()
          old = "https://tdzqkygwrdqqpjwculmf.supabase.co/rest/v1/flowforge_assessment_leads"
          if old not in s:
              print("Already fixed; nothing to do")
              raise SystemExit(0)
          s = s.replace(old, "https://tdzqkygwrdqqpjwculmf.supabase.co/functions/v1/flowforge-assessment")
          s = re.sub(r"headers:\{'Content-Type':'application/json','apikey':'[^']+','Prefer':'return=minimal'\}", "headers:{'Content-Type':'application/json','Accept':'application/json'}", s)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix FlowForge assessment submission"
          rm .github/workflows/fix-assessment.yml
          git add .github/workflows/fix-assessment.yml
          git commit --amend --no-edit
          git push
