name: Fix assessment submission
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch form request
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "'Content-Type':'application/json','Accept':'application/json'"
          new = "'Content-Type':'text/plain;charset=UTF-8','Accept':'application/json'"
          if old not in s:
              raise SystemExit('expected fetch header pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix assessment CORS preflight' || true
          git rm .github/workflows/fix-cors-submit.yml
          git commit -m 'Remove one-time patch workflow'
          git push
