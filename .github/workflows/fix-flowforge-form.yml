name: Fix FlowForge assessment form

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch form submission
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" = "fix: submit FlowForge assessment directly through Supabase REST" ]; then
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          new = r'''async function submitForm(e){e.preventDefault();const form=e.target;const btn=form.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Submitting...';try{const r=await fetch('https://tdzqkygwrdqqpjwculmf.supabase.co/rest/v1/flowforge_assessment_leads',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY,'Prefer':'return=minimal'},body:JSON.stringify({business_type:document.getElementById('businessType').value,repetitive_task:document.getElementById('repetitiveTask').value,contact:document.getElementById('contact').value})});if(!r.ok){const t=await r.text();throw new Error('submit failed '+r.status+' '+t)}alert('Thanks — your assessment has been received.');form.reset();closeModal()}catch(err){console.error(err);alert('We could not submit the assessment. Please try again.')}finally{btn.disabled=false;btn.textContent='Submit assessment'}}'''
          pattern = r"async function submitForm\(e\)\{.*?\}\s*document\.getElementById\('modal'\)\.addEventListener"
          s2, n = re.subn(pattern, new + "document.getElementById('modal').addEventListener", s, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one submitForm block, found {n}')
          p.write_text(s2)
          PY
      - name: Commit patched form
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: submit FlowForge assessment directly through Supabase REST"
          git push