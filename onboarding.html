<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create institute — AdmissionFlow</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>body{font-family:system-ui;background:#f5f7fb;margin:0}.wrap{max-width:640px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px}input,button{display:block;width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #d0d5dd;margin-top:10px;font:inherit}button{background:#4f46e5;color:#fff;border:0;font-weight:700}.notice{margin-top:10px;padding:12px;border-radius:10px;background:#fff7ed}.err{color:#b42318}.ok{color:#067647}a{color:#4f46e5}</style></head><body><main class="wrap"><section class="card"><h1>Create your institute</h1><p>Enter your institute name. AdmissionFlow generates the public URL automatically.</p><form id="f"><input id="name" name="name" placeholder="Institute name" minlength="2" required><div class="notice">Public URL: <b id="slug">/—</b></div><input name="email" type="email" placeholder="Owner email" autocomplete="email" required><input id="password" name="password" type="password" placeholder="Password (minimum 6 characters)" minlength="6" autocomplete="new-password" required><button type="button" id="toggle">Show password</button><button id="submit" type="submit">Create account</button><p id="msg"></p></form><p><a href="/">Back</a> · <a href="/login">Already have an account?</a></p></section></main><script>(()=>{const URL='https://tdzqkygwrdqqpjwculmf.supabase.co',KEY='sb_publishable__ITeCtWl3mFC7sqU0JlJvA_GkFUHRXl',PENDING='admissionflow_pending_signup_v4',db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),f=document.getElementById('f'),name=document.getElementById('name'),slug=document.getElementById('slug'),msg=document.getElementById('msg'),button=document.getElementById('submit'),toggle=document.getElementById('toggle'),password=document.getElementById('password');const slugify=v=>String(v||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').replace(/-+/g,'-');name.oninput=()=>slug.textContent='/'+(slugify(name.value)||'—');toggle.onclick=()=>{password.type=password.type==='password'?'text':'password';toggle.textContent=password.type==='password'?'Show password':'Hide password'};f.onsubmit=async e=>{e.preventDefault();button.disabled=true;button.textContent='Creating account…';msg.textContent='';try{const x=Object.fromEntries(new FormData(f));const email=x.email.trim().toLowerCase();localStorage.setItem(PENDING,JSON.stringify({name:x.name.trim(),email}));const {data,error}=await db.auth.signUp({email,password:x.password,options:{emailRedirectTo:location.origin+'/verify'}});if(error)throw error;if(data.session){const r=await db.rpc('create_institute_v3',{p_name:x.name.trim()});if(r.error)throw r.error;localStorage.removeItem(PENDING);location.href='/dashboard';return}location.href='/verify'}catch(e){msg.textContent=e.message||String(e);msg.className='err';button.disabled=false;button.textContent='Create account'}}})() </script></body></html>
