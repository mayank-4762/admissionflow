<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdmissionFlow</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:960px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:720px){.grid{grid-template-columns:1fr}}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stack>*+*{margin-top:10px}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #d0d5dd;width:100%}button{background:#4f46e5;color:#fff;border:0;font-weight:700;cursor:pointer}.secondary{background:#eef2ff;color:#3730a3}.danger{background:#b42318}.muted{color:#667085;font-size:14px}.err{color:#b42318}.ok{color:#067647}.notice{padding:12px;border:1px solid #fed7aa;background:#fff7ed;border-radius:10px}.lead{padding:12px;border:1px solid #e5e7eb;border-radius:12px;margin:8px 0}a{color:#4f46e5}</style></head><body><div id="app"><div class="wrap"><div class="card"><h1>AdmissionFlow</h1><p>Starting application…</p></div></div></div><script>
(()=>{
'use strict';
const app=document.getElementById('app');
const SUPABASE_URL='https://tdzqkygwrdqqpjwculmf.supabase.co';
const SUPABASE_KEY='sb_publishable__ITeCtWl3mFC7sqU0JlJvA_GkFUHRXl';
const pendingKey='admissionflow_pending_signup_v2';
const statuses=['New','Contacted','Interested','Demo booked','Joined','Not interested'];
let db=null,me=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slugify=v=>String(v||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').replace(/-+/g,'-');
const route=location.pathname.replace(/^\/+|\/+$/g,'').split('/').filter(Boolean);
const routeName=route[0]||'';
function page(html){app.innerHTML='<div class="wrap">'+html+'</div>'}
function message(t,c='ok'){const e=document.getElementById('msg');if(e){e.textContent=t;e.className=c}}
function initDb(){if(db)return db;if(!window.supabase||typeof window.supabase.createClient!=='function')throw new Error('Supabase library did not load.');db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return db}
function fatal(e){page('<div class="card"><h2>AdmissionFlow could not start</h2><p class="err">'+esc(e?.message||e||'Unknown error')+'</p><button onclick="location.reload()">Reload</button></div>')}
window.addEventListener('error',e=>{if(e.message)fatal(e.error||e.message)});
window.addEventListener('unhandledrejection',e=>fatal(e.reason||'Unhandled error'));
setTimeout(()=>{const p=app.textContent||'';if(p.includes('Starting application'))fatal('Application startup timed out. Check network access to Supabase/CDN and reload.')},10000);
async function finishPending(){
 const raw=localStorage.getItem(pendingKey);if(!raw)return false;
 let p;try{p=JSON.parse(raw)}catch{localStorage.removeItem(pendingKey);return false}
 const {data:{user},error:ue}=await initDb().auth.getUser();if(ue)throw ue;if(!user||!user.email_confirmed_at)return false;
 const {data:staff,error:se}=await db.from('staff').select('institute_id').eq('user_id',user.id).maybeSingle();if(se)throw se;
 if(staff){localStorage.removeItem(pendingKey);location.href='/dashboard';return true}
 const {error}=await db.rpc('create_institute_v3',{p_name:p.name});
 if(error){page('<div class="card"><h2>Email verified</h2><p class="err">Institute setup failed: '+esc(error.message)+'</p><button id="retry">Retry institute setup</button><p id="msg"></p></div>');document.getElementById('retry').onclick=finishPending;return true}
 localStorage.removeItem(pendingKey);location.href='/dashboard';return true;
}
function home(){page('<div class="card"><h1>AdmissionFlow</h1><p class="muted">Admissions CRM for coaching institutes and schools.</p><div class="row"><a href="/onboarding"><button>Create your institute</button></a><a href="/login"><button class="secondary">Staff login</button></a></div></div>')}
function onboarding(){page('<div class="card"><h1>Create your institute</h1><p class="muted">Enter your institute name. AdmissionFlow generates the public URL automatically.</p><form id="signup" class="stack"><input name="name" minlength="2" placeholder="Institute name" required><div class="notice">Public URL: <b id="slug">/—</b></div><input name="email" type="email" autocomplete="email" placeholder="Owner email" required><input name="password" type="password" minlength="6" autocomplete="new-password" placeholder="Password" required><button>Create account</button><p id="msg"></p></form><p class="muted">Already have an account? <a href="/login">Log in</a></p></div>');
 const f=document.getElementById('signup');const n=f.elements.name;n.oninput=()=>document.getElementById('slug').textContent='/'+(slugify(n.value)||'—');f.onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(f));initDb();localStorage.setItem(pendingKey,JSON.stringify({name:x.name,email:x.email.trim().toLowerCase()}));const {data,error}=await db.auth.signUp({email:x.email.trim().toLowerCase(),password:x.password});if(error){localStorage.removeItem(pendingKey);return message(error.message,'err')}if(data.session){await finishPending();return}location.href='/verify'}catch(err){message(err,'err')}};
}
function verify(){page('<div class="card"><h1>Verify your email</h1><p>Check your inbox and open the verification link.</p><div class="notice">After verification, return here and tap <b>I verified my email</b>. Your institute will then be created automatically.</div><div class="row"><button id="verified">I verified my email</button><button id="resend" class="secondary">Resend verification</button></div><p id="msg"></p><a href="/login">Back to login</a></div>');initDb();document.getElementById('verified').onclick=async()=>{try{await db.auth.refreshSession();if(!(await finishPending()))message('Email is not verified yet. Open the verification email first.','err')}catch(e){message(e,'err')}};document.getElementById('resend').onclick=async()=>{try{const p=JSON.parse(localStorage.getItem(pendingKey)||'{}');if(!p.email)return message('Signup email is missing. Start again.','err');const {error}=await db.auth.resend({type:'signup',email:p.email});if(error)message(error.message,'err');else message('Verification email sent again.')}catch(e){message(e,'err')}}}
function login(){page('<div class="card"><h1>Staff login</h1><form id="login" class="stack"><input name="email" type="email" autocomplete="email" placeholder="Email" required><input name="password" type="password" autocomplete="current-password" placeholder="Password" required><button>Login</button><p id="msg"></p></form><div class="row"><a href="/forgot-password">Forgot password?</a><a href="/onboarding">Create account</a></div></div>');const f=document.getElementById('login');f.onsubmit=async e=>{e.preventDefault();try{initDb();const x=Object.fromEntries(new FormData(f));const {data,error}=await db.auth.signInWithPassword({email:x.email.trim().toLowerCase(),password:x.password});if(error)return message(error.message,'err');if(!data.user?.email_confirmed_at)return message('Please verify your email before logging in.','err');if(!(await finishPending()))location.href='/dashboard'}catch(err){message(err,'err')}}}
function forgot(){page('<div class="card"><h1>Reset password</h1><form id="forgot" class="stack"><input name="email" type="email" placeholder="Email" required><button>Send reset email</button><p id="msg"></p></form><a href="/login">Back to login</a></div>');document.getElementById('forgot').onsubmit=async e=>{e.preventDefault();try{initDb();const email=String(new FormData(e.currentTarget).get('email')).trim().toLowerCase();const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password'});if(error)message(error.message,'err');else message('Reset email sent. Check your inbox.')}catch(err){message(err,'err')}}}
function reset(){page('<div class="card"><h1>Choose a new password</h1><form id="reset" class="stack"><input name="password" type="password" minlength="6" placeholder="New password" required><input name="confirm" type="password" minlength="6" placeholder="Confirm password" required><button>Update password</button><p id="msg"></p></form></div>');document.getElementById('reset').onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(e.currentTarget));if(x.password!==x.confirm)return message('Passwords do not match.','err');initDb();const {error}=await db.auth.updateUser({password:x.password});if(error)throw new Error(error.message);message('Password updated. Redirecting…');setTimeout(()=>location.href='/login',800)}catch(err){message(err,'err')}}}
async function publicPage(s){initDb();const {data,error}=await db.rpc('public_institute_v3',{p_slug:s});if(error||!data)return page('<div class="card"><h2>Institute not found</h2><a href="/">Home</a></div>');const i=data.institute,c=data.courses||[],b=data.batches||[];page('<div class="card"><h1>'+esc(i.name)+'</h1><p class="muted">'+esc(i.tagline||'Admissions')+'</p></div><div class="grid"><div class="card"><h2>Student enquiry</h2><form id="lead" class="stack"><input name="student_name" placeholder="Student name" required><input name="phone" placeholder="Phone" required><input name="email" type="email" placeholder="Email"><input name="class_name" placeholder="Class"><input name="board_exam" placeholder="Board / exam"><select name="course"><option value="">Course</option>'+c.map(x=>'<option>'+esc(x.name)+'</option>').join('')+'</select><select name="preferred_batch"><option value="">Preferred batch</option>'+b.map(x=>'<option>'+esc(x.name)+'</option>').join('')+'</select><button>Submit enquiry</button><p id="msg"></p></form></div><div class="card"><h2>Courses & batches</h2>'+(c.map(x=>'<div class="lead">'+esc(x.name)+'</div>').join('')||'<p class="muted">No courses yet.</p>')+b.map(x=>'<div class="lead">'+esc(x.name)+(x.timing?' — '+esc(x.timing):'')+'</div>').join('')+'</div></div>');document.getElementById('lead').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget));try{const {error}=await db.rpc('submit_admission_lead_v3',{p_slug:s,p_student_name:x.student_name,p_phone:x.phone,p_email:x.email||null,p_class_name:x.class_name||null,p_board_exam:x.board_exam||null,p_course:x.course||null,p_preferred_batch:x.preferred_batch||null,p_source:'website'});if(error)message(error.message,'err');else{e.currentTarget.reset();message('Enquiry submitted successfully.')}}catch(err){message(err,'err')}}}
async function dashboard(){initDb();const {data:{user},error:ue}=await db.auth.getUser();if(ue)throw ue;if(!user)return location.href='/login';if(!user.email_confirmed_at)return location.href='/verify';const {data:st,error}=await db.from('staff').select('institute_id,role').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!st){if(await finishPending())return;return location.href='/onboarding'}const {data:i,error:ie}=await db.from('institutes').select('*').eq('id',st.institute_id).single();if(ie||!i)throw new Error(ie?.message||'Institute not found');me={user,st,i};await render('leads')}
async function render(tab){const i=me.i;const [l,c,b]=await Promise.all([db.from('leads').select('*').eq('institute_id',i.id).order('created_at',{ascending:false}),db.from('admission_courses').select('*').eq('institute_id',i.id).order('name'),db.from('admission_batches').select('*').eq('institute_id',i.id).order('name')]);if(l.error)throw l.error;if(c.error)throw c.error;if(b.error)throw b.error;me.leads=l.data||[];me.courses=c.data||[];me.batches=b.data||[];let body='';if(tab==='leads')body='<div class="card"><h2>Leads ('+me.leads.length+')</h2>'+(me.leads.map(x=>'<div class="lead"><b>'+esc(x.student_name)+'</b><div class="muted">'+esc(x.phone)+'</div><select data-id="'+esc(x.id)+'">'+statuses.map(s=>'<option '+(s===(x.status||'New')?'selected':'')+'>'+s+'</option>').join('')+'</select></div>').join('')||'<p class="muted">No leads yet.</p>')+'</div>';else if(tab==='customize')body='<div class="card"><h2>Customize institute</h2><form id="settings" class="stack"><input name="name" value="'+esc(i.name)+'" required><input name="slug" value="'+esc(i.slug)+'" readonly><input name="tagline" value="'+esc(i.tagline||'')+'"><input name="logo_url" value="'+esc(i.logo_url||'')+'"><input name="primary_phone" value="'+esc(i.primary_phone||'')+'"><input name="whatsapp_number" value="'+esc(i.whatsapp_number||'')+'"><input name="address" value="'+esc(i.address||'')+'"><input name="primary_color" value="'+esc(i.primary_color||'#111827')+'"><button>Save settings</button><p id="msg"></p></form><p class="muted">Public URL: /'+esc(i.slug)+'</p></div>';else if(tab==='catalog')body='<div class="grid"><div class="card"><h2>Courses</h2><form id="course" class="stack"><input name="name" placeholder="Course" required><button>Add course</button></form>'+me.courses.map(x=>'<div class="lead">'+esc(x.name)+'</div>').join('')+'</div><div class="card"><h2>Batches</h2><form id="batch" class="stack"><input name="name" placeholder="Batch" required><input name="timing" placeholder="Timing"><button>Add batch</button></form>'+me.batches.map(x=>'<div class="lead">'+esc(x.name)+(x.timing?' — '+esc(x.timing):'')+'</div>').join('')+'</div></div>';else body='<div class="card"><h2>Staff</h2><p>'+esc(me.user.email)+' — '+esc(me.st.role)+'</p></div>';page('<div class="row"><h2>'+esc(i.name)+'</h2><button id="logout" class="danger">Logout</button></div><div class="row"><button data-tab="leads">Leads</button><button data-tab="customize">Customize</button><button data-tab="catalog">Courses & batches</button><button data-tab="staff">Staff</button></div>'+body);document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>render(x.dataset.tab));document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.href='/login'};document.querySelectorAll('[data-id]').forEach(x=>x.onchange=async()=>{const {error}=await db.from('leads').update({status:x.value,updated_at:new Date().toISOString()}).eq('id',x.dataset.id).eq('institute_id',i.id);if(error)message(error.message,'err');else render('leads')});if(tab==='customize')document.getElementById('settings').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget));delete x.slug;const {error}=await db.from('institutes').update(x).eq('id',i.id);if(error)message(error.message,'err');else{Object.assign(me.i,x);message('Settings saved')}};if(tab==='catalog'){document.getElementById('course').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget));const {error}=await db.from('admission_courses').insert({institute_id:i.id,name:x.name});if(error)message(error.message,'err');else render('catalog')};document.getElementById('batch').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget));const {error}=await db.from('admission_batches').insert({institute_id:i.id,name:x.name,timing:x.timing||null});if(error)message(error.message,'err');else render('catalog')}}}
(async()=>{try{initDb();const {data:{session},error}=await db.auth.getSession();if(error)throw error;if(routeName==='reset-password')return reset();if(routeName==='forgot-password')return forgot();if(routeName==='verify')return verify();if(routeName==='login')return login();if(routeName==='onboarding'){if(session){if(await finishPending())return;return dashboard()}return onboarding()}if(routeName==='dashboard')return dashboard();if(!routeName){if(session){if(await finishPending())return;return dashboard()}return home()}return publicPage(routeName)}catch(e){fatal(e)}})();
})();</script></body></html>
