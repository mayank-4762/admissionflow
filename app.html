<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdmissionFlow</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f5f7fb;color:#111827}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:18px;margin:16px 0;border:1px solid #e5e7eb}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #d0d5dd;width:100%}button{background:#4f46e5;color:#fff;border:0;font-weight:700;cursor:pointer}.secondary{background:#eef2ff;color:#3730a3}.danger{background:#b42318}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{width:auto}.muted{color:#667085;font-size:14px}.err{color:#b42318}.ok{color:#067647}.notice{padding:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px}.lead{padding:12px;border:1px solid #e5e7eb;border-radius:12px;margin:8px 0}.stack>*+*{margin-top:10px}a{color:#4f46e5}</style></head><body><div id="app"><div class="wrap"><div class="card"><h1>AdmissionFlow</h1><p>Loading…</p></div></div></div><script>
(function(){
'use strict';
const app=document.getElementById('app');const URL='https://tdzqkygwrdqqpjwculmf.supabase.co';const KEY='sb_publishable__ITeCtWl3mFC7sqU0JlJvA_GkFUHRXl';let db=null,me=null;const statuses=['New','Contacted','Interested','Demo booked','Joined','Not interested'];const slug=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').replace(/-+/g,'-');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dbi(){if(db)return db;if(!window.supabase?.createClient)throw Error('Supabase client failed to load');return db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}
function show(t,cl='ok'){const e=document.getElementById('msg');if(e){e.textContent=t;e.className=cl}}
function fail(e){app.innerHTML='<div class="wrap"><div class="card"><h2>AdmissionFlow error</h2><p class="err">'+esc(e)+'</p><a href="/">Return home</a></div></div>'}
window.addEventListener('error',e=>fail(e.error?.message||e.message||'Unknown error'));window.addEventListener('unhandledrejection',e=>fail(e.reason?.message||String(e.reason||'Unhandled error')));
async function finish(){const raw=localStorage.getItem('af_pending');if(!raw)return false;let p;try{p=JSON.parse(raw)}catch{localStorage.removeItem('af_pending');return false}const {data:{user}}=await dbi().auth.getUser();if(!user?.email_confirmed_at)return false;const {data:staff}=await db.from('staff').select('institute_id').eq('user_id',user.id).maybeSingle();if(staff){localStorage.removeItem('af_pending');location.href='/dashboard';return true}const {error}=await db.rpc('create_institute_v3',{p_name:p.name});if(error){app.innerHTML='<div class="wrap"><div class="card"><h2>Verified, but setup failed</h2><p class="err">'+esc(error.message)+'</p><button id="retry">Retry</button><p id="msg"></p></div></div>';document.getElementById('retry').onclick=finish;return true}localStorage.removeItem('af_pending');location.href='/dashboard';return true}
function home(){app.innerHTML='<div class="wrap"><div class="card"><h1>AdmissionFlow</h1><p class="muted">Admissions CRM for coaching institutes and schools.</p><div class="row"><a href="/onboarding"><button>Create your institute</button></a><a href="/login"><button class="secondary">Staff login</button></a></div></div></div>'}
function onboarding(){app.innerHTML='<div class="wrap"><div class="card"><h1>Create your institute</h1><p class="muted">The public URL is generated automatically from the institute name.</p><form id="f" class="stack"><input id="name" name="name" placeholder="Institute name" minlength="2" required><div class="notice">Public URL: <b id="slug">/—</b></div><input name="email" type="email" placeholder="Owner email" autocomplete="email" required><input name="password" type="password" placeholder="Password (minimum 6 characters)" minlength="6" autocomplete="new-password" required><button>Create account</button><p id="msg"></p></form><p class="muted">Already have an account? <a href="/login">Log in</a></p></div></div>';const f=document.getElementById('f'),name=document.getElementById('name');name.oninput=()=>document.getElementById('slug').textContent='/'+(slug(name.value)||'—');f.onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(f));localStorage.setItem('af_pending',JSON.stringify({name:x.name,email:x.email.toLowerCase()}));const {data,error}=await dbi().auth.signUp({email:x.email.trim().toLowerCase(),password:x.password});if(error){localStorage.removeItem('af_pending');return show(error.message,'err')}if(data.session)await finish();else location.href='/verify'}catch(err){show(err.message,'err')}}}
function verify(){app.innerHTML='<div class="wrap"><div class="card"><h1>Verify your email</h1><p>Check your inbox and open the verification link.</p><div class="notice">After verification, return here and tap the button below. Your institute will then be created automatically.</div><div class="row"><button id="v">I verified my email</button><button id="r" class="secondary">Resend verification</button></div><p id="msg"></p><a href="/login">Back to login</a></div></div>';document.getElementById('v').onclick=async()=>{try{await dbi().auth.refreshSession();if(!(await finish()))show('Email is not verified yet. Open the verification email first.','err')}catch(e){show(e.message,'err')}};document.getElementById('r').onclick=async()=>{try{const p=JSON.parse(localStorage.getItem('af_pending')||'{}');if(!p.email)return show('Signup email is missing. Start again.','err');const {error}=await dbi().auth.resend({type:'signup',email:p.email});if(error)show(error.message,'err');else show('Verification email sent again.')}catch(e){show(e.message,'err')}}}
function login(){app.innerHTML='<div class="wrap"><div class="card"><h1>Staff login</h1><form id="f" class="stack"><input name="email" type="email" placeholder="Email" autocomplete="email" required><input name="password" type="password" placeholder="Password" autocomplete="current-password" required><button>Login</button><p id="msg"></p></form><div class="row"><a href="/forgot-password">Forgot password?</a><a href="/onboarding">Create account</a></div></div></div>';document.getElementById('f').onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(e.currentTarget));const {data,error}=await dbi().auth.signInWithPassword({email:x.email.trim().toLowerCase(),password:x.password});if(error)return show(error.message,'err');if(!data.user?.email_confirmed_at)return show('Please verify your email before logging in.','err');if(!(await finish()))location.href='/dashboard'}catch(err){show(err.message,'err')}}}
function forgot(){app.innerHTML='<div class="wrap"><div class="card"><h1>Reset password</h1><form id="f" class="stack"><input name="email" type="email" placeholder="Email" required><button>Send reset email</button><p id="msg"></p></form><a href="/login">Back to login</a></div></div>';document.getElementById('f').onsubmit=async e=>{e.preventDefault();try{const email=String(new FormData(e.currentTarget).get('email')).trim().toLowerCase();const {error}=await dbi().auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password'});if(error)show(error.message,'err');else show('Reset email sent.')}catch(err){show(err.message,'err')}}}
function reset(){app.innerHTML='<div class="wrap"><div class="card"><h1>Choose a new password</h1><form id="f" class="stack"><input name="password" type="password" minlength="6" placeholder="New password" required><input name="confirm" type="password" minlength="6" placeholder="Confirm password" required><button>Update password</button><p id="msg"></p></form></div></div>';document.getElementById('f').onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(e.currentTarget));if(x.password!==x.confirm)return show('Passwords do not match.','err');const {error}=await dbi().auth.updateUser({password:x.password});if(error)throw Error(error.message);show('Password updated. Redirecting…');setTimeout(()=>location.href='/login',800)}catch(err){show(err.message,'err')}}}
async function publicPage(s){const {data,error}=await dbi().rpc('public_institute_v3',{p_slug:s});if(error||!data){app.innerHTML='<div class="wrap"><div class="card"><h2>Institute not found</h2><a href="/">Home</a></div></div>';return}const i=data.institute,c=data.courses||[],b=data.batches||[];app.innerHTML='<div class="wrap"><div class="card"><h1>'+esc(i.name)+'</h1><p class="muted">'+esc(i.tagline||'Admissions')+'</p></div><div class="grid"><div class="card"><h2>Student enquiry</h2><form id="f" class="stack"><input name="student_name" placeholder="Student name" required><input name="phone" placeholder="Phone" required><input name="email" type="email" placeholder="Email"><input name="class_name" placeholder="Class"><input name="board_exam" placeholder="Board / exam"><select name="course"><option value="">Course</option>'+c.map(x=>'<option>'+esc(x.name)+'</option>').join('')+'</select><select name="preferred_batch"><option value="">Preferred batch</option>'+b.map(x=>'<option>'+esc(x.name)+'</option>').join('')+'</select><button>Submit enquiry</button><p id="msg"></p></form></div><div class="card"><h2>Courses & batches</h2>'+(c.map(x=>'<div class="lead">'+esc(x.name)+'</div>').join('')||'<p class="muted">No courses yet.</p>')+b.map(x=>'<div class="lead">'+esc(x.name)+(x.timing?' — '+esc(x.timing):'')+'</div>').join('')+'</div></div></div>';document.getElementById('f').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget));try{const {error}=await db.rpc('submit_admission_lead_v3',{p_slug:s,p_student_name:x.student_name,p_phone:x.phone,p_email:x.email||null,p_class_name:x.class_name||null,p_board_exam:x.board_exam||null,p_course:x.course||null,p_preferred_batch:x.preferred_batch||null,p_source:'website'});if(error)show(error.message,'err');else{e.currentTarget.reset();show('Enquiry submitted successfully.')}}catch(err){show(err.message,'err')}}}
async function dashboard(){const {data:{user}}=await db.auth.getUser();if(!user)return location.href='/login';if(!user.email_confirmed_at)return location.href='/verify';const {data:st,error}=await db.from('staff').select('institute_id,role').eq('user_id',user.id).maybeSingle();if(error)throw Error(error.message);if(!st){if(await finish())return;return location.href='/onboarding'}const {data:i,error:ie}=await db.from('institutes').select('*').eq('id',st.institute_id).single();if(ie||!i)throw Error(ie?.message||'Institute not found');me={user,st,i};await render('leads')}
async function render(tab){const i=me.i;const [l,c,b]=await Promise.all([db.from('leads').select('*').eq('institute_id',i.id).order('created_at',{ascending:false}),db.from('admission_courses').select('*').eq('institute_id',i.id).order('name'),db.from('admission_batches').select('*').eq('institute_id',i.id).order('name')]);if(l.error)throw Error(l.error.message);if(c.error)throw Error(c.error.message);if(b.error)throw Error(b.error.message);me.leads=l.data||[];me.courses=c.data||[];me.batches=b.data||[];let body='';if(tab==='leads')body='<div class="card"><h2>Leads ('+me.leads.length+')</h2>'+(me.leads.map(l=>'<div class="lead"><b>'+esc(l.student_name)+'</b><div class="muted">'+esc(l.phone)+'</div><select data-id="'+esc(l.id)+'">'+statuses.map(s=>'<option '+(s===(l.status||'New')?'selected':'')+'>'+s+'</option>').join('')+'</select></div>').join('')||'<p class="muted">No leads yet.</p>')+'</div>';else if(tab==='customize')body='<div class="card"><h2>Customize</h2><form id="sf" class="stack"><input name="name" value="'+esc(i.name)+'" required><input name="slug" value="'+esc(i.slug)+'" readonly><input name="tagline" value="'+esc(i.tagline||'')+'"><input name="logo_url" value="'+esc(i.logo_url||'')+'"><input name="primary_phone" value="'+esc(i.primary_phone||'')+'"><input name="whatsapp_number" value="'+esc(i.whatsapp_number||'')+'"><input name="address" value="'+esc(i.address||'')+'"><input name="primary_color" value="'+esc(i.primary_color||'#111827')+'"><button>Save</button><p id="msg"></p></form><p class="muted">Public URL: /'+esc(i.slug)+'</p></div>';else if(tab==='catalog')body='<div class="grid"><div class="card"><h2>Courses</h2><form id="cf" class="stack"><input name="name" placeholder="Course" required><button>Add course</button></form>'+me.courses.map(x=>'<div class="lead">'+esc(x.name)+'</div>').join('')+'</div><div class="card"><h2>Batches</h2><form id="bf" class="stack"><input name="name" placeholder="Batch" required><input name="timing" placeholder="Timing"><button>Add batch</button></form>'+me.batches.map(x=>'<div class="lead">'+esc(x.name)+(x.timing?' — '+esc(x.timing):'')+'</div>').join('')+'</div></div>';else body='<div class="card"><h2>Staff</h2><p>'+esc(me.user.email)+' — '+esc(me.st.role)+'</p></div>';app.innerHTML='<div class="wrap"><div class="row"><h2>'+esc(i.name)+'</h2><button id="out" class="danger">Logout</button></div><div class="row"><button data-t="leads">Leads</button><button data-t="customize">Customize</button><button data-t="catalog">Courses & batches</button><button data-t="staff">Staff</button></div>'+body+'</div>';document.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>render(x.dataset.t));document.getElementById('out').onclick=async()=>{await db.auth.signOut();location.href='/login'};document.querySelectorAll('[data-id]').forEach(x=>x.onchange=async()=>{const {error}=await db.from('leads').update({status:x.value,updated_at:new Date().toISOString()}).eq('id',x.dataset.id).eq('institute_id',i.id);if(error)show(error.message,'err');else render('leads')});if(tab==='customize')document.getElementById('sf').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget));delete x.slug;const {error}=await db.from('institutes').update(x).eq('id',i.id);if(error)show(error.message,'err');else{Object.assign(me.i,x);show('Saved')}};if(tab==='catalog'){document.getElementById('cf').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget));const {error}=await db.from('admission_courses').insert({institute_id:i.id,name:x.name});if(error)show(error.message,'err');else render('catalog')};document.getElementById('bf').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget));const {error}=await db.from('admission_batches').insert({institute_id:i.id,name:x.name,timing:x.timing||null});if(error)show(error.message,'err');else render('catalog')}}}
(async()=>{try{dbi();const s=await db.getSession();if(routeName==='reset-password')return reset();if(routeName==='forgot-password')return forgot();if(routeName==='login')return login();if(routeName==='verify')return verify();if(routeName==='onboarding'){if(s.data.session){if(await finish())return;return dashboard()}return signup()}if(routeName==='dashboard')return dashboard();if(!routeName){if(s.data.session){if(await finish())return;return dashboard()}return home()}return publicPage(routeName)}catch(e){fatal(e.message)}})();
})();</script></body></html>
