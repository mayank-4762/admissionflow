<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>AdmissionFlow</title>
</head>
<body>
  <div style="font-family:system-ui,sans-serif;max-width:760px;margin:60px auto;padding:24px">
    <h1>AdmissionFlow</h1>
    <p id="status">Starting application…</p>
  </div>
  <script>
    const status=document.getElementById('status');
    const target='/app.html'+location.search+location.hash;
    const started=Date.now();
    const timer=setTimeout(()=>{
      status.textContent='AdmissionFlow is taking too long to start. Reload the page.';
    },10000);
    location.replace(target);
    window.addEventListener('pagehide',()=>clearTimeout(timer));
  </script>
</body>
</html>
