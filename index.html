<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdmissionFlow</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#111827}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#fff;padding:20px;border-radius:16px;margin:16px 0;border:1px solid #e5e7eb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}input,select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #d0d5dd}input,select{width:100%;box-sizing:border-box}button{background:#4f46e5;color:#fff;border:0;font-weight:700;cursor:pointer}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:#667085;font-size:13px}.err{color:#b42318}.ok{color:#067647}.lead{padding:14px;border:1px solid #e5e7eb;border-radius:12px;margin:10px 0}.hidden{display:none}</style></head><body><div id="app"><div class="wrap"><div class="card"><h1>AdmissionFlow</h1><p class="muted">Loading…</p></div></div></div><script>
(()=>{'use strict';
const app=document.getElementById('app'),URL='https://tdzqkygwrdqqpjwculmf.supabase.co',KEY='sb_publishable__ITeCtWl3mFC7sqU0JlJvA_GkFUHRXl';let db,me={};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statuses=['New','Contacted','Interested','Demo booked','Joined','Not interested'];
const route=location.pathname.split('/').filter(Boolean)[0]||'',qs=new URLSearchParams(location.search);
const pendingKey='admissionflow.pendingInstitute';
function D(){if(!db){if(!window.supabase?.createClient)throw Error('Supabase client failed to load');db=window.supabase.createClient(URL,KEY)}return db}
function msg(t,c='ok'){const e=document.getElementById('msg');if(e){e.textContent=t;e.className=c}}
function fatal(e){app.innerHTML='<div class="wrap"><div class="card"><h2>AdmissionFlow error</h2><p class="err">'+esc(e?.message||e)+'</p><a href="/">Home</a></div></div>'}
window.addEventListener('error',e=>fatal(e.error||e.message));window.addEventListener('unhandledrejection',e=>fatal(e.reason));
async function createInstituteFromPending(){const raw=localStorage.getItem(pendingKey);if(!raw)return null;let p;try{p=JSON.parse(raw)}catch{localStorage.removeItem(pendingKey);return null}const {data:{user}}=await D().auth.getUser();if(!user)return null;const {data:st}=await D().from('staff').select('institute_id').eq('user_id',user.id).maybeSingle();if(st){localStorage.removeItem(pendingKey);return st.institute_id}const {data,error}=await D().rpc('create_institute_v3',{p_name:p.name,p_slug:p.slug,p_tagline:p.tagline||'',p_primary_phone:p.phone||'',p_whatsapp_number:p.whatsapp||'',p_address:p.address||''});if(error)throw error;localStorage.removeItem(pendingKey);return data?.id}
function home(){app.innerHTML='<div class="wrap"><div class="card"><h1>AdmissionFlow</h1><p class="muted">Admissions CRM for coaching institutes and schools.</p><div class="row"><a href="/login"><button type="button">Staff login</button></a><a href="/onboarding"><button type="button">Create institute</button></a></div></div></div>'}
async function finishAuth(){const {data:{user}}=await D().auth.getUser();if(!user)return false;await createInstituteFromPending();const {data:st}=await D().from('staff').select('institute_id').eq('user_id',user.id).maybeSingle();if(st){location.href='/dashboard';return true}return false}
function login(){const verified=qs.get('verified');const reset=qs.get('reset');app.innerHTML='<div class="wrap"><div class="card"><h2>Staff login</h2>'+(verified?'<p class="ok">Email verified. Sign in to finish setting up your institute.</p>':'')+(reset?'<p class="ok">Password reset email sent.</p>':'')+'<form id="f"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required style="margin-top:10px"><button style="margin-top:12px">Login</button><p id="msg"></p></form><div class="row"><a href="/onboarding">Create account</a><button id="resend" type="button">Resend verification</button><button id="forgot" type="button">Forgot password</button></div></div></div>';const f=document.getElementById('f');f.addEventListener('submit',async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(f));const {error}=await D().auth.signInWithPassword({email:x.email,password:x.password});if(error){msg(error.message,'err');return}await finishAuth()}catch(err){msg(err.message,'err')}});document.getElementById('resend').onclick=async()=>{const email=f.email.value.trim();if(!email)return msg('Enter your email first.','err');const {error}=await D().auth.resend({type:'signup',email,options:{emailRedirectTo:location.origin+'/login?verified=1'}});msg(error?error.message:'Verification email sent. Check your inbox. ',error?'err':'ok')};document.getElementById('forgot').onclick=async()=>{const email=f.email.value.trim();if(!email)return msg('Enter your email first.','err');const {error}=await D().auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/login'});msg(error?error.message:'Password reset email sent.',error?'err':'ok')};const hash=location.hash;if(hash.includes('type=recovery'))showReset()}
async function showReset(){app.innerHTML='<div class="wrap"><div class="card"><h2>Set new password</h2><form id="r"><input name="password" type="password" minlength="6" placeholder="New password" required><button style="margin-top:12px">Update password</button><p id="msg"></p></form></div></div>';document.getElementById('r').onsubmit=async e=>{e.preventDefault();const p=new FormData(e.currentTarget).get('password'),{error}=await D().auth.updateUser({password:p});if(error)msg(error.message,'err');else location.href='/login'}}
function onboarding(){app.innerHTML='<div class="wrap"><div class="card"><h2>Create your institute</h2><form id="f"><input name="name" minlength="2" placeholder="Institute name" required><input name="slug" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" placeholder="public-slug" required style="margin-top:10px"><input name="tagline" placeholder="Tagline" style="margin-top:10px"><input name="phone" placeholder="Phone" style="margin-top:10px"><input name="whatsapp" placeholder="WhatsApp" style="margin-top:10px"><input name="address" placeholder="Address" style="margin-top:10px"><input name="email" type="email" placeholder="Owner email" required style="margin-top:10px"><input name="password" type="password" minlength="6" placeholder="Password" required style="margin-top:10px"><button style="margin-top:12px">Create account</button><p id="msg"></p></form></div></div>';document.getElementById('f').onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(e.currentTarget));localStorage.setItem(pendingKey,JSON.stringify({name:x.name,slug:x.slug,tagline:x.tagline,phone:x.phone,whatsapp:x.whatsapp,address:x.address}));const {data,error}=await D().auth.signUp({email:x.email,password:x.password,options:{emailRedirectTo:location.origin+'/login?verified=1'}});if(error){localStorage.removeItem(pendingKey);msg(error.message,'err');return}if(data.session){await createInstituteFromPending();location.href='/dashboard';return}app.innerHTML='<div class="wrap"><div class="card"><h2>Check your email</h2><p class="muted">Your account was created. Verify your email, then return here and sign in. Your institute details are saved safely in this browser.</p><a href="/login"><button type="button">Go to login</button></a></div></div>'}catch(err){msg(err.message,'err')}}}
async function publicPage(slug){const {data,error}=await D().rpc('public_institute_v3',{p_slug:slug});if(error||!data){app.innerHTML='<div class="wrap"><div class="card"><h2>Institute not found</h2><a href="/">Back</a></div></div>';return}const i=data.institute,c=data.courses||[],b=data.batches||[];app.innerHTML='<div class="wrap"><div class="card"><h1>'+esc(i.name)+'</h1><p class="muted">'+esc(i.tagline||'Admission enquiry')+'</p></div><div class="grid"><div class="card"><h2>Student enquiry</h2><form id="f"><input name="student_name" placeholder="Student name" required><input name="phone" placeholder="Phone" required style="margin-top:10px"><input name="email" type="email" placeholder="Email" style="margin-top:10px"><input name="class_name" placeholder="Class" style="margin-top:10px"><input name="board_exam" placeholder="Board / exam" style="margin-top:10px"><select name="course" style="margin-top:10px"><option value="">Course</option>'+c.map(x=>'<option>'+esc(x.name)+'</option>').join('')+'</select><select name="preferred_batch" style="margin-top:10px"><option value="">Preferred batch</option>'+b.map(x=>'<option>'+esc(x.name)+'</option>').join('')+'</select><button style="margin-top:12px;width:100%">Submit enquiry</button><p id="msg"></p></form></div><div class="card"><h2>Courses & batches</h2>'+(c.map(x=>'<div class="lead">'+esc(x.name)+'</div>').join('')||'<p class="muted">No courses listed.</p>')+b.map(x=>'<div class="lead">'+esc(x.name)+(x.start_date?' — '+esc(x.start_date):'')+'</div>').join('')+'</div></div></div>';document.getElementById('f').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget)),{error}=await D().rpc('submit_admission_lead_v3',{p_slug:slug,p_student_name:x.student_name,p_phone:x.phone,p_email:x.email||null,p_class_name:x.class_name||null,p_board_exam:x.board_exam||null,p_course:x.course||null,p_preferred_batch:x.preferred_batch||null,p_source:'website'});if(error)msg(error.message,'err');else{e.currentTarget.reset();msg('Enquiry submitted successfully.')}}}
async function dashboard(){const {data:{user}}=await D().auth.getUser();if(!user)return location.href='/login';await createInstituteFromPending();const {data:st,error}=await D().from('staff').select('institute_id,role').eq('user_id',user.id).maybeSingle();if(error||!st){app.innerHTML='<div class="wrap"><div class="card"><h2>Institute setup required</h2><p class="muted">Your account is verified, but no institute is attached yet.</p><a href="/onboarding">Finish setup</a></div></div>';return}const {data:i,error:ie}=await D().from('institutes').select('*').eq('id',st.institute_id).single();if(ie||!i)throw Error(ie?.message||'Institute not found');me={user,st,i};await render('leads')}
async function render(tab){const i=me.i;const [l,c,b]=await Promise.all([D().from('leads').select('*').eq('institute_id',i.id).order('created_at',{ascending:false}),D().from('admission_courses').select('*').eq('institute_id',i.id).order('name'),D().from('admission_batches').select('*').eq('institute_id',i.id).order('start_date')]);if(l.error)throw l.error;me.leads=l.data||[];me.courses=c.data||[];me.batches=b.data||[];let body=tab==='leads'?'<div class="card"><h2>Leads ('+me.leads.length+')</h2>'+(me.leads.map(x=>'<div class="lead"><b>'+esc(x.student_name)+'</b><div class="muted">'+esc(x.phone)+' '+esc(x.email||'')+'</div><select data-id="'+esc(x.id)+'">'+statuses.map(s=>'<option '+(s===(x.status||'New')?'selected':'')+'>'+s+'</option>').join('')+'</select></div>').join('')||'<p class="muted">No leads yet.</p>')+'</div>':tab==='customize'?'<div class="card"><h2>Customize</h2><form id="settings"><div class="grid"><input name="name" value="'+esc(i.name)+'"><input name="slug" value="'+esc(i.slug)+'"><input name="tagline" value="'+esc(i.tagline||'')+'"><input name="logo_url" value="'+esc(i.logo_url||'')+'"><input name="primary_phone" value="'+esc(i.primary_phone||'')+'"><input name="whatsapp_number" value="'+esc(i.whatsapp_number||'')+'"><input name="address" value="'+esc(i.address||'')+'"><input name="primary_color" value="'+esc(i.primary_color||'#4f46e5')+'"></div><button style="margin-top:12px">Save</button><p id="msg"></p></form></div>':tab==='catalog'?'<div class="grid"><div class="card"><h2>Courses</h2><form id="cf"><input name="name" placeholder="Course" required><button>Add</button></form>'+me.courses.map(x=>'<div class="lead">'+esc(x.name)+'</div>').join('')+'</div><div class="card"><h2>Batches</h2><form id="bf"><input name="name" placeholder="Batch" required><input name="start_date" type="date"><button>Add</button></form>'+me.batches.map(x=>'<div class="lead">'+esc(x.name)+'</div>').join('')+'</div></div>':'<div class="card"><h2>Staff</h2><p>'+esc(me.user.email)+' — '+esc(me.st.role)+'</p></div>';app.innerHTML='<div class="wrap"><div class="row" style="justify-content:space-between"><div><h2>'+esc(i.name)+'</h2><span class="muted">/'+esc(i.slug)+'</span></div><button id="out">Logout</button></div><div class="row" style="margin:12px 0"><button data-tab="leads">Leads</button><button data-tab="customize">Customize</button><button data-tab="catalog">Courses & batches</button><button data-tab="staff">Staff</button></div>'+body+'</div>';document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>render(x.dataset.tab));document.getElementById('out').onclick=async()=>{await D().auth.signOut();location.href='/login'};document.querySelectorAll('[data-id]').forEach(s=>s.onchange=async()=>{const {error}=await D().from('leads').update({status:s.value,follow_up_at:new Date(Date.now()+864e5).toISOString(),updated_at:new Date().toISOString()}).eq('id',s.dataset.id).eq('institute_id',i.id);if(error)msg(error.message,'err');else render('leads')});if(tab==='customize')document.getElementById('settings').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget)),{error}=await D().from('institutes').update(x).eq('id',i.id);if(error)msg(error.message,'err');else{Object.assign(me.i,x);msg('Settings saved.')}};if(tab==='catalog'){document.getElementById('cf').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget)),{error}=await D().from('admission_courses').insert({institute_id:i.id,name:x.name});if(error)msg(error.message,'err');else render('catalog')};document.getElementById('bf').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget)),{error}=await D().from('admission_batches').insert({institute_id:i.id,name:x.name,start_date:x.start_date||null});if(error)msg(error.message,'err');else render('catalog')}}}
(async()=>{try{if(!route)return home();if(route==='login')return login();if(route==='onboarding')return onboarding();if(route==='dashboard')return dashboard();return publicPage(route)}catch(e){fatal(e)}})();
})();</script></body></html>
