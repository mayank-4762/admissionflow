<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdmissionFlow</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#111827}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:white;padding:20px;border-radius:16px;margin:16px 0;border:1px solid #e5e7eb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}input,select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #d0d5dd}input,select{width:100%;box-sizing:border-box}button{background:#4f46e5;color:white;border:0;font-weight:700;cursor:pointer}.muted{color:#667085;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.lead{padding:14px;border:1px solid #e5e7eb;border-radius:12px;margin:10px 0}.danger{background:#b42318}.ok{color:#067647}.err{color:#b42318}</style></head><body><div id="app"></div><script>
const URL='https://tdzqkygwrdqqpjwculmf.supabase.co',KEY='sb_publishable__ITeCtWl3mFC7sqU0JlJvA_GkFUHRXl',db=supabase.createClient(URL,KEY),app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const path=location.pathname.split('/').filter(Boolean);const route=path[0]||'';const statuses=['New','Contacted','Interested','Demo booked','Joined','Not interested'];let me={};
function msg(t,c='ok'){const e=document.getElementById('msg');if(e){e.textContent=t;e.className=c}}
async function publicPage(slug){const {data,error}=await db.rpc('public_institute_v3',{p_slug:slug});if(error||!data){app.innerHTML='<div class="wrap"><div class="card"><h2>Institute not found</h2></div></div>';return}const i=data.institute,c=data.courses||[],b=data.batches||[];document.title=i.name+' — Admissions';app.innerHTML=`<div class="wrap"><div class="card"><h1>${esc(i.name)}</h1><p class="muted">${esc(i.tagline||'Admission enquiry')}</p></div><div class="grid"><div class="card"><h2>Student enquiry</h2><form id="f"><input name="student_name" placeholder="Student name" required><input name="phone" placeholder="Phone" required style="margin-top:10px"><input name="email" type="email" placeholder="Email" style="margin-top:10px"><input name="class_name" placeholder="Class" style="margin-top:10px"><input name="board_exam" placeholder="Board / exam" style="margin-top:10px"><select name="course" style="margin-top:10px"><option value="">Course</option>${c.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select><select name="preferred_batch" style="margin-top:10px"><option value="">Preferred batch</option>${b.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select><button style="width:100%;margin-top:12px">Submit enquiry</button><p id="msg"></p></form></div><div class="card"><h2>Courses & batches</h2>${c.map(x=>`<div class="lead">${esc(x.name)}</div>`).join('')||'<p class="muted">Contact us for courses.</p>'}${b.map(x=>`<div class="lead">${esc(x.name)} ${x.start_date?'— '+esc(x.start_date):''}</div>`).join('')}</div></div></div>`;f.onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(f));const {error}=await db.rpc('submit_admission_lead_v3',{p_institute_id:i.id,p_student_name:x.student_name,p_phone:x.phone,p_email:x.email||null,p_class_name:x.class_name||null,p_board_exam:x.board_exam||null,p_course:x.course||null,p_preferred_batch:x.preferred_batch||null,p_source:'website'});if(error)msg(error.message,'err');else{f.reset();msg('Enquiry submitted successfully.')}}}
function login(){app.innerHTML='<div class="wrap"><div class="card"><h2>Staff login</h2><form id="f"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required style="margin-top:10px"><button style="margin-top:12px">Login</button><p id="msg"></p></form></div></div>';f.onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(f));const {error}=await db.auth.signInWithPassword(x);if(error)msg(error.message,'err');else location.href='/dashboard'}}
function onboarding(){app.innerHTML='<div class="wrap"><div class="card"><h2>Create institute</h2><form id="f"><input name="name" placeholder="Institute name" required><input name="slug" placeholder="public-slug" required style="margin-top:10px"><input name="email" type="email" placeholder="Owner email" required style="margin-top:10px"><input name="password" type="password" minlength="6" placeholder="Password" required style="margin-top:10px"><button style="margin-top:12px">Create</button><p id="msg"></p></form></div></div>';f.onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(f));const s=await db.auth.signUp({email:x.email,password:x.password});if(s.error)return msg(s.error.message,'err');if(!s.data.session)return msg('Account created. Confirm email, then login.','ok');const {error}=await db.rpc('create_institute_v3',{p_name:x.name,p_slug:x.slug});if(error)msg(error.message,'err');else location.href='/dashboard'}}
async function dashboard(){const {data:{user}}=await db.auth.getUser();if(!user)return location.href='/login';const {data:st,error}=await db.from('staff').select('institute_id,role').eq('user_id',user.id).maybeSingle();if(error||!st){app.innerHTML='<div class="wrap"><div class="card">No institute access.</div></div>';return}const {data:i}=await db.from('institutes').select('*').eq('id',st.institute_id).single();me={user,st,i};render('leads')}
async function data(){const i=me.i;const [l,c,b]=await Promise.all([db.from('leads').select('*').eq('institute_id',i.id).order('created_at',{ascending:false}),db.from('admission_courses').select('*').eq('institute_id',i.id).order('name'),db.from('admission_batches').select('*').eq('institute_id',i.id).order('start_date')]);me.leads=l.data||[];me.courses=c.data||[];me.batches=b.data||[]}
async function render(tab){await data();const i=me.i;let body='';if(tab==='leads')body=`<div class="card"><h2>Leads (${me.leads.length})</h2>${me.leads.map(l=>`<div class="lead"><b>${esc(l.student_name)}</b><div class="muted">${esc(l.phone)} ${esc(l.email||'')}</div><select data-id="${l.id}" style="margin-top:8px">${statuses.map(s=>`<option ${s===(l.status||'New')?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'<p class="muted">No leads yet.</p>'}</div>`;else if(tab==='customize')body=`<div class="card"><h2>Customize institute</h2><form id="settings"><div class="grid"><input name="name" value="${esc(i.name)}" placeholder="Name"><input name="slug" value="${esc(i.slug)}" placeholder="Slug"><input name="tagline" value="${esc(i.tagline||'')}" placeholder="Tagline"><input name="logo_url" value="${esc(i.logo_url||'')}" placeholder="Logo URL"><input name="phone" value="${esc(i.phone||'')}" placeholder="Phone"><input name="whatsapp" value="${esc(i.whatsapp||'')}" placeholder="WhatsApp"><input name="address" value="${esc(i.address||'')}" placeholder="Address"><input name="primary_color" value="${esc(i.primary_color||'#4f46e5')}" placeholder="Primary color"></div><button style="margin-top:12px">Save</button><p id="msg"></p></form></div><div class="card"><b>Public enquiry URL</b><p><a href="/${esc(i.slug)}">/${esc(i.slug)}</a></p></div>`;else if(tab==='catalog')body=`<div class="grid"><div class="card"><h2>Courses</h2><form id="cf"><input name="name" placeholder="Course" required><button style="margin-top:8px">Add</button></form>${me.courses.map(x=>`<div class="lead">${esc(x.name)}</div>`).join('')}</div><div class="card"><h2>Batches</h2><form id="bf"><input name="name" placeholder="Batch" required><input name="start_date" type="date" style="margin-top:8px"><button style="margin-top:8px">Add</button></form>${me.batches.map(x=>`<div class="lead">${esc(x.name)}</div>`).join('')}</div></div>`;else body=`<div class="card"><h2>Staff</h2><p class="muted">Owner can invite counsellors through the Supabase Edge Function.</p><p>${esc(me.user.email)} — ${esc(me.st.role)}</p></div>`;app.innerHTML=`<div class="wrap"><div class="row" style="justify-content:space-between"><div><h2>${esc(i.name)}</h2><span class="muted">/${esc(i.slug)}</span></div><button id="out">Logout</button></div><div class="row" style="margin:12px 0">${[['leads','Leads'],['customize','Customize'],['catalog','Courses & batches'],['staff','Staff']].map(x=>`<button data-tab="${x[0]}">${x[1]}</button>`).join('')}</div>${body}</div>`;document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>render(x.dataset.tab));out.onclick=async()=>{await db.auth.signOut();location.href='/login'};document.querySelectorAll('[data-id]').forEach(s=>s.onchange=async()=>{await db.from('leads').update({status:s.value,follow_up_at:new Date(Date.now()+864e5).toISOString(),updated_at:new Date().toISOString()}).eq('id',s.dataset.id).eq('institute_id',i.id);render('leads')});if(tab==='customize')settings.onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(settings));const {error}=await db.from('institutes').update(x).eq('id',i.id);if(error)msg(error.message,'err');else{Object.assign(me.i,x);msg('Settings saved.')}};if(tab==='catalog'){cf.onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(cf));await db.from('admission_courses').insert({institute_id:i.id,name:x.name});render('catalog')};bf.onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(bf));await db.from('admission_batches').insert({institute_id:i.id,name:x.name,start_date:x.start_date||null});render('catalog')}}}
(async()=>{if(route==='login')return login();if(route==='onboarding')return onboarding();if(route==='dashboard')return dashboard();return publicPage(route||'demo')})();
</script></body></html>
