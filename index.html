<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AdmissionFlow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f7fb;color:#111827}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:18px;margin:16px 0;border:1px solid #e5e7eb;box-shadow:0 3px 15px rgba(16,24,40,.04)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #d0d5dd}input,select{width:100%}button{background:#4f46e5;color:#fff;border:0;font-weight:700;cursor:pointer}button.secondary{background:#eef2ff;color:#3730a3}button.danger{background:#b42318}.muted{color:#667085;font-size:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.lead{padding:14px;border:1px solid #e5e7eb;border-radius:12px;margin:10px 0}.err{color:#b42318}.ok{color:#067647}.status{padding:12px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.small{font-size:13px}.stack>*+*{margin-top:10px}a{color:#4f46e5}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="card"><h1>AdmissionFlow</h1><p class="muted">Loading…</p></div></div></div>
<script>
(function(){
'use strict';
const app=document.getElementById('app');
const SUPABASE_URL='https://tdzqkygwrdqqpjwculmf.supabase.co';
const SUPABASE_KEY='sb_publishable__ITeCtWl3mFC7sqU0JlJvA_GkFUHRXl';
let db=null,me=null;
const statuses=['New','Contacted','Interested','Demo booked','Joined','Not interested'];
const route=location.pathname.replace(/^\/+|\/+$/g,'').split('/').filter(Boolean);
const routeName=route[0]||'';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ensureDb(){if(db)return db;const lib=window.supabase;if(!lib||typeof lib.createClient!=='function')throw new Error('Supabase client failed to load.');db=lib.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return db}
function msg(t,c='ok'){const e=document.getElementById('msg');if(e){e.textContent=t;e.className=c}}
function fatal(e){app.innerHTML='<div class="wrap"><div class="card"><h2>AdmissionFlow could not start</h2><p class="err">'+esc(e)+'</p><a href="/">Return home</a></div></div>'}
window.addEventListener('error',e=>{console.error(e.error||e.message);fatal((e.error&&e.error.message)||e.message||'Unknown JavaScript error')});
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);const m=e.reason&&e.reason.message?e.reason.message:String(e.reason||'Unhandled promise rejection');if(document.getElementById('app'))fatal(m)});
function home(){app.innerHTML='<div class="wrap"><div class="card"><h1>AdmissionFlow</h1><p class="muted">Admissions CRM for coaching institutes and schools.</p><div class="row"><a href="/onboarding"><button type="button">Create your institute</button></a><a href="/login"><button type="button" class="secondary">Staff login</button></a></div></div></div>'}
function slugPreview(name){return String(name||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').replace(/-+/g,'-')}
async function finishPendingSignup(){
  const raw=localStorage.getItem('admissionflow_pending_signup');
  if(!raw)return false;
  let p;try{p=JSON.parse(raw)}catch{localStorage.removeItem('admissionflow_pending_signup');return false}
  const {data:{user}}=await ensureDb().auth.getUser();
  if(!user||!user.email_confirmed_at)return false;
  const {data:staff}=await db.from('staff').select('institute_id').eq('user_id',user.id).maybeSingle();
  if(staff){localStorage.removeItem('admissionflow_pending_signup');location.href='/dashboard';return true}
  const {error}=await db.rpc('create_institute_v3',{p_name:p.name});
  if(error){app.innerHTML='<div class="wrap"><div class="card"><h2>Account verified, but institute setup needs attention</h2><p class="err">'+esc(error.message)+'</p><button id="retry">Retry setup</button><p id="msg"></p></div></div>';document.getElementById('retry').onclick=()=>finishPendingSignup();return true}
  localStorage.removeItem('admissionflow_pending_signup');location.href='/dashboard';return true
}
function signup(){
app.innerHTML='<div class="wrap"><div class="card"><h1>Create your institute</h1><p class="muted">Your public URL slug is generated automatically from your institute name.</p><form id="f" class="stack"><input name="name" placeholder="Institute name" required minlength="2"><div class="status" id="slugBox">Public URL: <b>/—</b></div><input name="email" type="email" placeholder="Owner email" required autocomplete="email"><input name="password" type="password" placeholder="Password (minimum 6 characters)" required minlength="6" autocomplete="new-password"><button>Create account</button><p id="msg"></p></form><p class="small">Already have an account? <a href="/login">Log in</a></p></div></div>';
const f=document.getElementById('f'),name=f.elements.name,box=document.getElementById('slugBox');name.addEventListener('input',()=>{box.innerHTML='Public URL: <b>/'+esc(slugPreview(name.value)||'—')+'</b>'});f.addEventListener('submit',async e=>{e.preventDefault();try{ensureDb();const x=Object.fromEntries(new FormData(f));const pending={name:x.name};localStorage.setItem('admissionflow_pending_signup',JSON.stringify(pending));const {data,error}=await db.auth.signUp({email:x.email.trim().toLowerCase(),password:x.password});if(error){localStorage.removeItem('admissionflow_pending_signup');return msg(error.message,'err')}if(data.session){await finishPendingSignup();return}location.href='/verify'}catch(err){msg(err.message,'err')}})
}
function verify(){
app.innerHTML='<div class="wrap"><div class="card"><h1>Verify your email</h1><p>We created your account. Check your email and tap the verification link.</p><div class="status">After verification, return here and tap <b>I verified my email</b>. Your institute will be created automatically.</div><div class="row" style="margin-top:14px"><button id="verified">I verified my email</button><button id="resend" class="secondary">Resend verification</button></div><p id="msg"></p><p class="small"><a href="/login">Back to login</a></p></div></div>';
document.getElementById('verified').onclick=async()=>{try{await db.auth.refreshSession();if(await finishPendingSignup())return;msg('Email is not verified yet. Open the verification email first.','err')}catch(e){msg(e.message,'err')}};
document.getElementById('resend').onclick=async()=>{try{const raw=localStorage.getItem('admissionflow_pending_signup');if(!raw)return msg('Signup details are no longer saved. Please start signup again.','err');const p=JSON.parse(raw);const email=prompt('Enter the email address you used for signup:');if(!email)return;const {error}=await db.auth.resend({type:'signup',email:email.trim().toLowerCase()});if(error)msg(error.message,'err');else msg('Verification email sent again.')}catch(e){msg(e.message,'err')}}
}
function login(){
app.innerHTML='<div class="wrap"><div class="card"><h1>Staff login</h1><form id="f" class="stack"><input name="email" type="email" placeholder="Email" required autocomplete="email"><input name="password" type="password" placeholder="Password" required autocomplete="current-password"><button>Login</button><p id="msg"></p></form><div class="row"><a href="/forgot-password">Forgot password?</a><a href="/onboarding">Create account</a></div></div></div>';
const f=document.getElementById('f');f.addEventListener('submit',async e=>{e.preventDefault();try{ensureDb();const x=Object.fromEntries(new FormData(f));const {data,error}=await db.auth.signInWithPassword({email:x.email.trim().toLowerCase(),password:x.password});if(error)return msg(error.message,'err');if(!data.user?.email_confirmed_at){return msg('Please verify your email before logging in.','err')}const pending=await finishPendingSignup();if(!pending)location.href='/dashboard'}catch(err){msg(err.message,'err')}})
}
function forgot(){app.innerHTML='<div class="wrap"><div class="card"><h1>Reset your password</h1><form id="f" class="stack"><input name="email" type="email" placeholder="Email" required><button>Send reset link</button><p id="msg"></p></form><a href="/login">Back to login</a></div></div>';document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();try{ensureDb();const email=new FormData(e.currentTarget).get('email');const {error}=await db.auth.resetPasswordForEmail(String(email).trim().toLowerCase(),{redirectTo:location.origin+'/reset-password'});if(error)msg(error.message,'err');else msg('Password reset email sent. Check your inbox.')}catch(err){msg(err.message,'err')}})}
function reset(){app.innerHTML='<div class="wrap"><div class="card"><h1>Choose a new password</h1><form id="f" class="stack"><input name="password" type="password" minlength="6" placeholder="New password" required autocomplete="new-password"><input name="confirm" type="password" minlength="6" placeholder="Confirm new password" required autocomplete="new-password"><button>Update password</button><p id="msg"></p></form></div></div>';document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(e.currentTarget));if(x.password!==x.confirm)return msg('Passwords do not match.','err');ensureDb();const {error}=await db.auth.updateUser({password:x.password});if(error)return msg(error.message,'err');msg('Password updated. Redirecting to login…');setTimeout(()=>location.href='/login',900)}catch(err){msg(err.message,'err')}})}
async function publicPage(slug){ensureDb();const {data,error}=await db.rpc('public_institute_v3',{p_slug:slug});if(error||!data){app.innerHTML='<div class="wrap"><div class="card"><h2>Institute not found</h2><p class="muted">No public institute exists for <b>'+esc(slug)+'</b>.</p><a href="/">Back to AdmissionFlow</a></div></div>';return}const i=data.institute,c=data.courses||[],b=data.batches||[];document.title=i.name+' — Admissions';app.innerHTML='<div class="wrap"><div class="card"><h1>'+esc(i.name)+'</h1><p class="muted">'+esc(i.tagline||'Admission enquiry')+'</p></div><div class="grid"><div class="card"><h2>Student enquiry</h2><form id="f" class="stack"><input name="student_name" placeholder="Student name" required><input name="phone" placeholder="Phone" required><input name="email" type="email" placeholder="Email"><input name="class_name" placeholder="Class"><input name="board_exam" placeholder="Board / exam"><select name="course"><option value="">Course</option>'+c.map(x=>'<option>'+esc(x.name)+'</option>').join('')+'</select><select name="preferred_batch"><option value="">Preferred batch</option>'+b.map(x=>'<option>'+esc(x.name)+'</option>').join('')+'</select><button>Submit enquiry</button><p id="msg"></p></form></div><div class="card"><h2>Courses & batches</h2>'+(c.map(x=>'<div class="lead">'+esc(x.name)+'</div>').join('')||'<p class="muted">Contact us for courses.</p>')+b.map(x=>'<div class="lead">'+esc(x.name)+(x.timing?' — '+esc(x.timing):'')+'</div>').join('')+'</div></div></div>';document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,x=Object.fromEntries(new FormData(f));try{const {error}=await db.rpc('submit_admission_lead_v3',{p_slug:slug,p_student_name:x.student_name,p_phone:x.phone,p_email:x.email||null,p_class_name:x.class_name||null,p_board_exam:x.board_exam||null,p_course:x.course||null,p_preferred_batch:x.preferred_batch||null,p_source:'website'});if(error)msg(error.message,'err');else{f.reset();msg('Enquiry submitted successfully.')}}catch(err){msg(err.message,'err')}})}
async function dashboard(){ensureDb();const {data:{user}}=await db.auth.getUser();if(!user)return location.href='/login';if(!user.email_confirmed_at)return location.href='/verify';const {data:st,error}=await db.from('staff').select('institute_id,role').eq('user_id',user.id).maybeSingle();if(error)throw new Error(error.message);if(!st){const pending=await finishPendingSignup();if(pending)return;return location.href='/onboarding'}const {data:i,error:ie}=await db.from('institutes').select('*').eq('id',st.institute_id).single();if(ie||!i)throw new Error(ie?ie.message:'Institute not found');me={user,st,i};await render('leads')}
async function loadData(){const i=me.i;const [l,c,b]=await Promise.all([db.from('leads').select('*').eq('institute_id',i.id).order('created_at',{ascending:false}),db.from('admission_courses').select('*').eq('institute_id',i.id).order('name'),db.from('admission_batches').select('*').eq('institute_id',i.id).order('name')]);if(l.error)throw new Error(l.error.message);if(c.error)throw new Error(c.error.message);if(b.error)throw new Error(b.error.message);me.leads=l.data||[];me.courses=c.data||[];me.batches=b.data||[]}
async function render(tab){await loadData();const i=me.i;let body='';if(tab==='leads')body='<div class="card"><h2>Leads ('+me.leads.length+')</h2>'+(me.leads.map(l=>'<div class="lead"><b>'+esc(l.student_name)+'</b><div class="muted">'+esc(l.phone)+' '+esc(l.email||'')+'</div><select data-id="'+esc(l.id)+'" style="margin-top:8px">'+statuses.map(s=>'<option '+(s===(l.status||'New')?'selected':'')+'>'+s+'</option>').join('')+'</select></div>').join('')||'<p class="muted">No leads yet.</p>')+'</div>';else if(tab==='customize')body='<div class="card"><h2>Customize institute</h2><form id="settings" class="stack"><div class="grid"><input name="name" value="'+esc(i.name)+'" placeholder="Name"><input name="slug" value="'+esc(i.slug)+'" readonly><input name="tagline" value="'+esc(i.tagline||'')+'" placeholder="Tagline"><input name="logo_url" value="'+esc(i.logo_url||'')+'" placeholder="Logo URL"><input name="primary_phone" value="'+esc(i.primary_phone||'')+'" placeholder="Phone"><input name="whatsapp_number" value="'+esc(i.whatsapp_number||'')+'" placeholder="WhatsApp"><input name="address" value="'+esc(i.address||'')+'" placeholder="Address"><input name="primary_color" value="'+esc(i.primary_color||'#4f46e5')}" placeholder="Primary color"></div><button>Save settings</button><p id="msg"></p></form><p class="muted">Public URL: <a href="/'+esc(i.slug)+'">/'+esc(i.slug)+'</a></p></div>';else if(tab==='catalog')body='<div class="grid"><div class="card"><h2>Courses</h2><form id="cf" class="stack"><input name="name" placeholder="Course" required><button>Add course</button></form>'+me.courses.map(x=>'<div class="lead">'+esc(x.name)+'</div>').join('')+'</div><div class="card"><h2>Batches</h2><form id="bf" class="stack"><input name="name" placeholder="Batch" required><input name="timing" placeholder="Timing e.g. 5 PM - 7 PM"><button>Add batch</button></form>'+me.batches.map(x=>'<div class="lead">'+esc(x.name)+(x.timing?' — '+esc(x.timing):'')+'</div>').join('')+'</div></div>';else body='<div class="card"><h2>Staff</h2><p>'+esc(me.user.email)+' — '+esc(me.st.role)+'</p><p class="muted">Staff invitation can be added here later.</p></div>';app.innerHTML='<div class="wrap"><div class="row" style="justify-content:space-between"><div><h2>'+esc(i.name)+'</h2><span class="muted">/'+esc(i.slug)+'</span></div><button id="out" class="danger">Logout</button></div><div class="row" style="margin:14px 0"><button data-tab="leads">Leads</button><button data-tab="customize">Customize</button><button data-tab="catalog">Courses & batches</button><button data-tab="staff">Staff</button></div>'+body+'</div>';document.querySelectorAll('[data-tab]').forEach(x=>x.addEventListener('click',()=>render(x.dataset.tab)));document.getElementById('out').onclick=async()=>{await db.auth.signOut();location.href='/login'};document.querySelectorAll('[data-id]').forEach(s=>s.addEventListener('change',async()=>{const {error}=await db.from('leads').update({status:s.value,follow_up_at:new Date(Date.now()+864e5).toISOString(),updated_at:new Date().toISOString()}).eq('id',s.dataset.id).eq('institute_id',i.id);if(error)msg(error.message,'err');else render('leads')}));if(tab==='customize')document.getElementById('settings').addEventListener('submit',async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget));delete x.slug;const {error}=await db.from('institutes').update(x).eq('id',i.id);if(error)msg(error.message,'err');else{Object.assign(me.i,x);msg('Settings saved.')}});if(tab==='catalog'){document.getElementById('cf').addEventListener('submit',async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget));const {error}=await db.from('admission_courses').insert({institute_id:i.id,name:x.name});if(error)msg(error.message,'err');else render('catalog')});document.getElementById('bf').addEventListener('submit',async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget));const {error}=await db.from('admission_batches').insert({institute_id:i.id,name:x.name,timing:x.timing||null});if(error)msg(error.message,'err');else render('catalog')})}}
(async()=>{try{ensureDb();const session=await db.auth.getSession();if((routeName==='reset-password'))return reset();if((routeName==='forgot-password'))return forgot();if((routeName==='login'))return login();if((routeName==='onboarding')){if(session.data.session){const pending=await finishPendingSignup();if(pending)return;return location.href='/dashboard'}return signup()}if((routeName==='verify'))return verify();if(!routeName)return session.data.session?((await finishPendingSignup())||home()):home();if(routeName==='dashboard')return dashboard();return publicPage(routeName)}catch(err){console.error(err);fatal(err&&err.message?err.message:String(err))}})();
})();
</script>
</body>
</html>
