<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AdmissionFlow V3</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--accent:#4f46e5;--accent2:#eef2ff;--danger:#b42318;--ok:#067647}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:10px;object-fit:cover;background:#e5e7eb}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 2px #0000000a;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d0d5dd;border-radius:9px;background:#fff}textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:650;background:var(--accent);color:#fff}.btn.secondary{background:#fff;color:var(--text);border:1px solid #d0d5dd}.btn.danger{background:#b42318}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted)}.small{font-size:12px}.error{color:var(--danger);margin-top:8px}.ok{color:var(--ok);margin-top:8px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap}.lead{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--accent2);font-size:12px}.stat{font-size:28px;font-weight:750}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}.hero{padding:30px 0}.hero h1{font-size:38px;margin:0 0 8px}.hero p{font-size:17px;color:var(--muted)}.center{max-width:620px;margin:50px auto}.course,.batch{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.notice{padding:10px 12px;border-radius:9px;background:#fef3c7;margin-bottom:12px}
</style>
</head>
<body><div id="app"></div>
<script>
const SUPABASE_URL='https://tdzqkygwrdqqpjwculmf.supabase.co';
const SUPABASE_KEY='sb_publishable__ITeCtWl3mFC7sqU0JlJvA_GkFUHRXl';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const route=()=>location.pathname.replace(/^\/+|\/+$/g,'')||'';
function nav(){return `<div class="top"><div class="brand"><div><b>AdmissionFlow</b><div class="small muted">Admissions CRM</div></div></div><div class="row"><a class="btn secondary" href="/login">Staff login</a><a class="btn" href="/onboarding">Start</a></div></div>`}
function shell(body){app.innerHTML=`<div class="wrap">${nav()}${body}</div>`}
function msg(id,text,cls='error'){const e=document.getElementById(id);if(e)e.className=cls,e.textContent=text}
async function publicInstitute(slug){const {data,error}=await sb.rpc('public_institute_v3',{p_slug:slug});if(error)throw error;return data}
function publicPage(cfg){const courses=cfg.courses||[],batches=cfg.batches||[];document.documentElement.style.setProperty('--accent',cfg.primary_color||'#4f46e5');app.innerHTML=`<div class="wrap"><div class="hero"><div class="brand">${cfg.logo_url?`<img class="logo" src="${esc(cfg.logo_url)}">`:''}<div><h1>${esc(cfg.name)}</h1><div class="muted">${esc(cfg.tagline||'Enquire about admissions')}</div></div></div></div><div class="grid"><div class="card"><h2>Admissions enquiry</h2><p class="muted">Fill this form and our counsellor can follow up.</p><form id="leadForm"><div class="grid"><div><label>Student name *</label><input name="student_name" required></div><div><label>Phone *</label><input name="phone" required></div><div><label>Email</label><input name="email" type="email"></div><div><label>Class</label><input name="class_name"></div><div><label>Board / exam</label><input name="board_exam"></div><div><label>Course</label><select name="course"><option value="">Select</option>${courses.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></div><div><label>Preferred batch</label><select name="preferred_batch"><option value="">Select</option>${batches.map(b=>`<option>${esc(b.name)}</option>`).join('')}</select></div><div><label>Source</label><input name="source" value="website"></div></div><button class="btn" style="margin-top:14px">Submit enquiry</button><div id="leadMsg"></div></form></div><div class="card"><h2>Courses & batches</h2>${courses.length?courses.map(c=>`<div class="course"><span>${esc(c.name)}</span></div>`).join(''):'<p class="muted">Courses will appear here.</p>'}${batches.length?'<h3>Upcoming batches</h3>'+batches.map(b=>`<div class="batch"><span>${esc(b.name)}</span><span class="small muted">${esc(b.start_date||'')}</span></div>`).join(''):''}<p class="small muted">${esc(cfg.address||'')} ${cfg.phone?' · '+esc(cfg.phone):''}</p></div></div></div>`;document.getElementById('leadForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const payload=Object.fromEntries(f.entries());payload.p_institute_id=cfg.id;const {data,error}=await sb.rpc('submit_admission_lead_v3',{p_institute_id:cfg.id,p_student_name:payload.student_name,p_phone:payload.phone,p_email:payload.email||null,p_class_name:payload.class_name||null,p_board_exam:payload.board_exam||null,p_course:payload.course||null,p_preferred_batch:payload.preferred_batch||null,p_source:payload.source||'website'});if(error){msg('leadMsg',error.message);return}e.target.reset();msg('leadMsg','Enquiry submitted successfully.','ok')}}
async function onboarding(){shell(`<div class="center card"><h1>Create your institute</h1><p class="muted">The owner account becomes the first institute administrator.</p><form id="on"><label>Institute name</label><input name="name" required><label style="margin-top:10px">Slug</label><input name="slug" placeholder="my-institute" required><label style="margin-top:10px">Email</label><input name="email" type="email" required><label style="margin-top:10px">Password</label><input name="password" type="password" minlength="6" required><button class="btn" style="margin-top:14px">Create institute</button><div id="m"></div></form></div>`);document.getElementById('on').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const x=Object.fromEntries(f.entries());let r=await sb.auth.signUp({email:x.email,password:x.password});if(r.error){msg('m',r.error.message);return}if(!r.data.user){msg('m','Signup did not return a user. Check Supabase Auth email settings.');return}const {data,error}=await sb.rpc('create_institute_v3',{p_name:x.name,p_slug:x.slug});if(error){msg('m',error.message);return}msg('m','Institute created. Continue to dashboard.','ok');setTimeout(()=>location.href='/dashboard',800)}}
async function login(){shell(`<div class="center card"><h1>Staff login</h1><form id="login"><label>Email</label><input name="email" type="email" required><label style="margin-top:10px">Password</label><input name="password" type="password" required><button class="btn" style="margin-top:14px">Login</button><div id="m"></div></form></div>`);document.getElementById('login').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target).entries());const {error}=await sb.auth.signInWithPassword({email:x.email,password:x.password});if(error){msg('m',error.message);return}location.href='/dashboard'}}
let current={};
async function dashboard(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='/login';return}const {data:staff,error:se}=await sb.from('staff').select('institute_id,role').eq('user_id',user.id).maybeSingle();if(se||!staff){shell('<div class="center card"><h2>No institute access</h2><p class="muted">Your account is not linked to an institute.</p></div>');return}const {data:inst,error:ie}=await sb.from('institutes').select('*').eq('id',staff.institute_id).single();if(ie){shell(`<div class="card">${esc(ie.message)}</div>`);return}current={user,staff,inst};renderDash('Leads');}
async function renderDash(tab){const inst=current.inst;const {data:leads}=await sb.from('leads').select('*').eq('institute_id',inst.id).order('created_at',{ascending:false});const {data:courses}=await sb.from('admission_courses').select('*').eq('institute_id',inst.id).order('name');const {data:batches}=await sb.from('admission_batches').select('*').eq('institute_id',inst.id).order('start_date');current.leads=leads||[];current.courses=courses||[];current.batches=batches||[];const content=tab==='Leads'?leadsView():tab==='Customize'?customizeView():tab==='Courses & batches'?catalogView():staffView();app.innerHTML=`<div class="wrap"><div class="top"><div><b>${esc(inst.name)}</b><div class="small muted">/${esc(inst.slug)}</div></div><button id="logout" class="btn secondary">Logout</button></div><div class="tabs">${['Leads','Customize','Courses & batches','Staff'].map(t=>`<button class="btn ${tab===t?'':'secondary'} tab" data-tab="${t}">${t}</button>`).join('')}</div>${content}</div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>renderDash(b.dataset.tab));document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='/login'};bindDash(tab)}
function leadsView(){const counts=current.leads.reduce((a,l)=>(a[l.status||'New']=(a[l.status||'New']||0)+1,a),{});return `<div class="grid"><div class="card"><div class="muted">Total leads</div><div class="stat">${current.leads.length}</div></div><div class="card"><div class="muted">Follow-ups due</div><div class="stat">${current.leads.filter(l=>l.follow_up_at&&new Date(l.follow_up_at)<=new Date()).length}</div></div></div><div class="card"><div class="row" style="justify-content:space-between"><h2>Leads</h2><button id="csv" class="btn secondary">Export CSV</button></div>${current.leads.length?current.leads.map(l=>`<div class="lead"><div class="row" style="justify-content:space-between"><b>${esc(l.student_name)}</b><span class="pill">${esc(l.status||'New')}</span></div><div class="small muted">${esc(l.phone)} ${l.email?' · '+esc(l.email):''}</div><div class="small">${esc(l.course||'')} ${l.class_name?' · '+esc(l.class_name):''} ${l.preferred_batch?' · '+esc(l.preferred_batch):''}</div><div class="row" style="margin-top:8px"><select data-status="${l.id}">${['New','Contacted','Interested','Demo booked','Joined','Not interested'].map(s=>`<option ${s===(l.status||'New')?'selected':''}>${s}</option>`).join('')}</select><input type="datetime-local" data-follow="${l.id}" value="${l.follow_up_at?new Date(l.follow_up_at).toISOString().slice(0,16):''}"><button class="btn" data-save="${l.id}">Save</button></div></div>`).join(''):'<p class="muted">No enquiries yet. Use the public enquiry page to create one.</p>'}</div>`}
function customizeView(){const i=current.inst;return `<div class="card"><h2>Institute customization</h2><form id="settings"><div class="grid"><div><label>Name</label><input name="name" value="${esc(i.name)}"></div><div><label>Slug</label><input name="slug" value="${esc(i.slug)}"></div><div><label>Tagline</label><input name="tagline" value="${esc(i.tagline||'')}"></div><div><label>Logo URL</label><input name="logo_url" value="${esc(i.logo_url||'')}"></div><div><label>Phone</label><input name="phone" value="${esc(i.phone||'')}"></div><div><label>WhatsApp</label><input name="whatsapp" value="${esc(i.whatsapp||'')}"></div><div><label>Address</label><input name="address" value="${esc(i.address||'')}"></div><div><label>Website</label><input name="website" value="${esc(i.website||'')}"></div><div><label>Primary color</label><input name="primary_color" value="${esc(i.primary_color||'#4f46e5')}"></div></div><button class="btn" style="margin-top:14px">Save</button><div id="m"></div></form></div><div class="card"><b>Public enquiry URL</b><p><a href="/${esc(i.slug)}" target="_blank">/${esc(i.slug)}</a></p></div>`}
function catalogView(){return `<div class="grid"><div class="card"><h2>Courses</h2><form id="course"><input name="name" placeholder="Course name" required><button class="btn" style="margin-top:8px">Add course</button></form>${current.courses.map(c=>`<div class="course"><span>${esc(c.name)}</span><button class="btn danger small" data-del-course="${c.id}">Remove</button></div>`).join('')}</div><div class="card"><h2>Batches</h2><form id="batch"><input name="name" placeholder="Batch name" required><input name="start_date" type="date" style="margin-top:8px"><button class="btn" style="margin-top:8px">Add batch</button></form>${current.batches.map(b=>`<div class="batch"><span>${esc(b.name)} <span class="small muted">${esc(b.start_date||'')}</span></span><button class="btn danger small" data-del-batch="${b.id}">Remove</button></div>`).join('')}</div></div>`}
function staffView(){return `<div class="card"><h2>Staff</h2><p class="muted">Owner can invite counsellors.</p>${current.staff.role==='owner'?`<form id="invite"><input name="email" type="email" placeholder="counsellor@example.com" required><button class="btn" style="margin-top:8px">Invite counsellor</button><div id="m"></div></form>`:'<p>You are a counsellor. Staff invitations are owner-only.</p>'}</div>`}
function bindDash(tab){if(tab==='Leads'){document.getElementById('csv').onclick=()=>{const rows=[['student_name','phone','email','course','status','follow_up_at'],...current.leads.map(l=>[l.student_name,l.phone,l.email||'',l.course||'',l.status||'New',l.follow_up_at||''])];const csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='leads.csv';a.click()};document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save,status=document.querySelector(`[data-status="${id}"]`).value,fi=document.querySelector(`[data-follow="${id}"]`).value;const {error}=await sb.from('leads').update({status,follow_up_at:fi?new Date(fi).toISOString():null,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else renderDash('Leads')})}if(tab==='Customize')document.getElementById('settings').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target).entries());const {error}=await sb.from('institutes').update(x).eq('id',current.inst.id);if(error){msg('m',error.message);return}current.inst={...current.inst,...x};msg('m','Saved.','ok')};if(tab==='Courses & batches'){document.getElementById('course').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target).entries());const {error}=await sb.from('admission_courses').insert({institute_id:current.inst.id,name:x.name});if(error)alert(error.message);else renderDash(tab)};document.getElementById('batch').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target).entries());const {error}=await sb.from('admission_batches').insert({institute_id:current.inst.id,name:x.name,start_date:x.start_date||null});if(error)alert(error.message);else renderDash(tab)};document.querySelectorAll('[data-del-course]').forEach(b=>b.onclick=async()=>{await sb.from('admission_courses').delete().eq('id',b.dataset.delCourse);renderDash(tab)});document.querySelectorAll('[data-del-batch]').forEach(b=>b.onclick=async()=>{await sb.from('admission_batches').delete().eq('id',b.dataset.delBatch);renderDash(tab)})}if(tab==='Staff'&&current.staff.role==='owner')document.getElementById('invite').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target).entries());const {data:{session}}=await sb.auth.getSession();const r=await fetch(SUPABASE_URL+'/functions/v1/admissionflow-invite-staff',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:x.email})});const j=await r.json();if(!r.ok){msg('m',j.error||'Invite failed');return}msg('m','Counsellor invited.','ok');e.target.reset()}}
(async()=>{try{const r=route();if(r==='onboarding')return onboarding();if(r==='login')return login();if(r==='dashboard')return dashboard();if(r){const cfg=await publicInstitute(r);return publicPage(cfg)}shell(`<div class="center card"><h1>AdmissionFlow</h1><p class="muted">Admissions management for coaching institutes.</p><div class="row"><a class="btn" href="/onboarding">Create institute</a><a class="btn secondary" href="/login">Staff login</a></div></div>`)}catch(e){shell(`<div class="center card"><h2>Unable to load</h2><p class="error">${esc(e.message||e)}</p></div>`)}})();
</script></body></html>
