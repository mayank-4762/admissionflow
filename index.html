<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AdmissionFlow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:960px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin:14px 0;box-shadow:0 4px 18px rgba(16,24,40,.04)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:720px){.grid{grid-template-columns:1fr}}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stack>*+*{margin-top:10px}input,select,button{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid #d0d5dd}button{background:#4f46e5;color:#fff;border:0;font-weight:700;cursor:pointer}.secondary{background:#eef2ff;color:#3730a3}.danger{background:#b42318}.muted{color:#667085;font-size:14px}.err{color:#b42318}.ok{color:#067647}.notice{padding:12px;border:1px solid #fed7aa;background:#fff7ed;border-radius:10px}.lead{padding:12px;border:1px solid #e5e7eb;border-radius:12px;margin:8px 0}a{color:#4f46e5}.small{font-size:13px}.title{margin:0 0 8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  'use strict';
  const SUPABASE_URL='https://tdzqkygwrdqqpjwculmf.supabase.co';
  const SUPABASE_KEY='sb_publishable__ITeCtWl3mFC7sqU0JlJvA_GkFUHRXl';
  const PENDING_KEY='admissionflow_pending_signup_v3';
  const statuses=['New','Contacted','Interested','Demo booked','Joined','Not interested'];
  let db=null,current=null;
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const slugify=v=>String(v||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').replace(/-+/g,'-');
  const route=()=>location.pathname.replace(/^\/+|\/+$/g,'').split('/').filter(Boolean)[0]||'';
  function getDb(){if(db)return db;if(!window.supabase||typeof window.supabase.createClient!=='function')throw new Error('Supabase client could not load.');db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return db}
  function setPage(html){document.getElementById('app').innerHTML='<div class="wrap">'+html+'</div>'}
  function setMsg(text,kind='ok'){const el=document.getElementById('msg');if(el){el.textContent=String(text?.message||text||'');el.className=kind}}
  function fail(err){setPage('<div class="card"><h1 class="title">AdmissionFlow</h1><p class="err">'+esc(err?.message||err||'Unexpected error')+'</p><button id="reload">Reload</button></div>');document.getElementById('reload').onclick=()=>location.reload()}
  function home(){setPage('<div class="card"><h1 class="title">AdmissionFlow</h1><p class="muted">Admissions CRM for coaching institutes and schools.</p><div class="row"><a href="/onboarding"><button>Create your institute</button></a><a href="/login"><button class="secondary">Staff login</button></a></div></div>')}
  async function finishSignup(){const raw=localStorage.getItem(PENDING_KEY);if(!raw)return false;let pending;try{pending=JSON.parse(raw)}catch{localStorage.removeItem(PENDING_KEY);return false}const {data,error}=await getDb().auth.getUser();if(error)throw error;const user=data.user;if(!user||!user.email_confirmed_at)return false;const {data:staff,error:staffError}=await db.from('staff').select('institute_id').eq('user_id',user.id).maybeSingle();if(staffError)throw staffError;if(staff){localStorage.removeItem(PENDING_KEY);location.href='/dashboard';return true}const {error:createError}=await db.rpc('create_institute_v3',{p_name:pending.name});if(createError)throw createError;localStorage.removeItem(PENDING_KEY);location.href='/dashboard';return true}
  function onboarding(){setPage('<div class="card"><h1 class="title">Create your institute</h1><p class="muted">Your public URL is generated automatically from the institute name.</p><form id="signup" class="stack"><input name="name" placeholder="Institute name" minlength="2" required autocomplete="organization"><div class="notice">Public URL: <b id="slug">/—</b></div><input name="email" type="email" placeholder="Owner email" required autocomplete="email"><input name="password" type="password" placeholder="Password (minimum 6 characters)" minlength="6" required autocomplete="new-password"><button>Create account</button><p id="msg"></p></form><p class="small muted">Already have an account? <a href="/login">Log in</a></p></div>');const form=document.getElementById('signup');const name=form.elements.name;name.oninput=()=>document.getElementById('slug').textContent='/'+(slugify(name.value)||'—');form.onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(form));getDb();localStorage.setItem(PENDING_KEY,JSON.stringify({name:x.name,email:x.email.trim().toLowerCase()}));const {data,error}=await db.auth.signUp({email:x.email.trim().toLowerCase(),password:x.password});if(error){localStorage.removeItem(PENDING_KEY);return setMsg(error.message,'err')}if(data.session){await finishSignup();return}location.href='/verify'}catch(err){setMsg(err,'err')}}}
  function verify(){setPage('<div class="card"><h1 class="title">Verify your email</h1><p>Check your inbox and open the verification link.</p><div class="notice">After verification, return here and tap <b>I verified my email</b>.</div><div class="row" style="margin-top:14px"><button id="verified">I verified my email</button><button id="resend" class="secondary">Resend verification</button></div><p id="msg"></p><a href="/login">Back to login</a></div>');getDb();document.getElementById('verified').onclick=async()=>{try{await db.auth.refreshSession();if(!(await finishSignup()))setMsg('Email is not verified yet. Open the verification email first.','err')}catch(err){setMsg(err,'err')}};document.getElementById('resend').onclick=async()=>{try{const pending=JSON.parse(localStorage.getItem(PENDING_KEY)||'{}');if(!pending.email)return setMsg('Signup details are missing. Start again.','err');const {error}=await db.auth.resend({type:'signup',email:pending.email});if(error)setMsg(error.message,'err');else setMsg('Verification email sent again.')}catch(err){setMsg(err,'err')}}}
  function login(){setPage('<div class="card"><h1 class="title">Staff login</h1><form id="login" class="stack"><input name="email" type="email" placeholder="Email" required autocomplete="email"><input name="password" type="password" placeholder="Password" required autocomplete="current-password"><button>Login</button><p id="msg"></p></form><div class="row"><a href="/forgot-password">Forgot password?</a><a href="/onboarding">Create account</a></div></div>');const form=document.getElementById('login');form.onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(form));getDb();const {data,error}=await db.auth.signInWithPassword({email:x.email.trim().toLowerCase(),password:x.password});if(error)return setMsg(error.message,'err');if(!data.user?.email_confirmed_at)return setMsg('Please verify your email before logging in.','err');if(!(await finishSignup()))location.href='/dashboard'}catch(err){setMsg(err,'err')}}}
  function forgot(){setPage('<div class="card"><h1 class="title">Reset password</h1><form id="forgot" class="stack"><input name="email" type="email" placeholder="Email" required autocomplete="email"><button>Send reset email</button><p id="msg"></p></form><a href="/login">Back to login</a></div>');document.getElementById('forgot').onsubmit=async e=>{e.preventDefault();try{getDb();const email=String(new FormData(e.currentTarget).get('email')).trim().toLowerCase();const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password'});if(error)setMsg(error.message,'err');else setMsg('Reset email sent. Check your inbox.')}catch(err){setMsg(err,'err')}}}
  function resetPassword(){setPage('<div class="card"><h1 class="title">Choose a new password</h1><form id="reset" class="stack"><input name="password" type="password" minlength="6" placeholder="New password" required autocomplete="new-password"><input name="confirm" type="password" minlength="6" placeholder="Confirm password" required autocomplete="new-password"><button>Update password</button><p id="msg"></p></form></div>');document.getElementById('reset').onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(e.currentTarget));if(x.password!==x.confirm)return setMsg('Passwords do not match.','err');getDb();const {error}=await db.auth.updateUser({password:x.password});if(error)throw error;setMsg('Password updated. Redirecting…');setTimeout(()=>location.href='/login',800)}catch(err){setMsg(err,'err')}}}
  async function publicPage(slug){try{getDb();const {data,error}=await db.rpc('public_institute_v3',{p_slug:slug});if(error||!data)return setPage('<div class="card"><h1>Institute not found</h1><p class="muted">No institute exists at this public URL.</p><a href="/">Home</a></div>');const i=data.institute,courses=data.courses||[],batches=data.batches||[];document.title=i.name+' — AdmissionFlow';setPage('<div class="card"><h1>'+esc(i.name)+'</h1><p class="muted">'+esc(i.tagline||'Admissions')+'</p></div><div class="grid"><div class="card"><h2>Student enquiry</h2><form id="lead" class="stack"><input name="student_name" placeholder="Student name" required><input name="phone" placeholder="Phone" required><input name="email" type="email" placeholder="Email"><input name="class_name" placeholder="Class"><input name="board_exam" placeholder="Board / exam"><select name="course"><option value="">Course</option>'+courses.map(c=>'<option>'+esc(c.name)+'</option>').join('')+'</select><select name="preferred_batch"><option value="">Preferred batch</option>'+batches.map(b=>'<option>'+esc(b.name)+'</option>').join('')+'</select><button>Submit enquiry</button><p id="msg"></p></form></div><div class="card"><h2>Courses & batches</h2>'+(courses.map(c=>'<div class="lead">'+esc(c.name)+'</div>').join('')||'<p class="muted">No courses listed.</p>')+batches.map(b=>'<div class="lead">'+esc(b.name)+(b.timing?' — '+esc(b.timing):'')+'</div>').join('')+'</div></div>');document.getElementById('lead').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget));try{const {error}=await db.rpc('submit_admission_lead_v3',{p_slug:slug,p_student_name:x.student_name,p_phone:x.phone,p_email:x.email||null,p_class_name:x.class_name||null,p_board_exam:x.board_exam||null,p_course:x.course||null,p_preferred_batch:x.preferred_batch||null,p_source:'website'});if(error)setMsg(error.message,'err');else{e.currentTarget.reset();setMsg('Enquiry submitted successfully.')}}catch(err){setMsg(err,'err')}}}}catch(err){fail(err)}}
  async function dashboard(){try{getDb();const {data,error}=await db.auth.getUser();if(error)throw error;const user=data.user;if(!user)return location.href='/login';if(!user.email_confirmed_at)return location.href='/verify';const {data:staff,error:staffError}=await db.from('staff').select('institute_id,role').eq('user_id',user.id).maybeSingle();if(staffError)throw staffError;if(!staff){if(await finishSignup())return;return location.href='/onboarding'}const {data:institute,error:instituteError}=await db.from('institutes').select('*').eq('id',staff.institute_id).single();if(instituteError)throw instituteError;current={user,staff,institute};await renderDashboard('leads')}catch(err){fail(err)}}
  async function renderDashboard(tab){const i=current.institute;const [leads,courses,batches]=await Promise.all([db.from('leads').select('*').eq('institute_id',i.id).order('created_at',{ascending:false}),db.from('admission_courses').select('*').eq('institute_id',i.id).order('name'),db.from('admission_batches').select('*').eq('institute_id',i.id).order('name')]);if(leads.error)throw leads.error;if(courses.error)throw courses.error;if(batches.error)throw batches.error;const ls=leads.data||[],cs=courses.data||[],bs=batches.data||[];let body='';if(tab==='leads')body='<div class="card"><h2>Leads ('+ls.length+')</h2>'+(ls.map(l=>'<div class="lead"><b>'+esc(l.student_name)+'</b><div class="muted">'+esc(l.phone)+'</div><select data-lead="'+esc(l.id)+'">'+statuses.map(s=>'<option '+(s===(l.status||'New')?'selected':'')+'>'+s+'</option>').join('')+'</select></div>').join('')||'<p class="muted">No leads yet.</p>')+'</div>';else if(tab==='customize')body='<div class="card"><h2>Customize institute</h2><form id="settings" class="stack"><input name="name" value="'+esc(i.name)+'" required><input name="slug" value="'+esc(i.slug)+'" readonly><input name="tagline" value="'+esc(i.tagline||'')+'"><input name="logo_url" value="'+esc(i.logo_url||'')+'"><input name="primary_phone" value="'+esc(i.primary_phone||'')+'"><input name="whatsapp_number" value="'+esc(i.whatsapp_number||'')+'"><input name="address" value="'+esc(i.address||'')+'"><input name="primary_color" value="'+esc(i.primary_color||'#4f46e5')+'"><button>Save settings</button><p id="msg"></p></form><p class="muted">Public URL: /'+esc(i.slug)+'</p></div>';else if(tab==='catalog')body='<div class="grid"><div class="card"><h2>Courses</h2><form id="course" class="stack"><input name="name" placeholder="Course" required><button>Add course</button></form>'+cs.map(c=>'<div class="lead">'+esc(c.name)+'</div>').join('')+'</div><div class="card"><h2>Batches</h2><form id="batch" class="stack"><input name="name" placeholder="Batch" required><input name="timing" placeholder="Timing"><button>Add batch</button></form>'+bs.map(b=>'<div class="lead">'+esc(b.name)+(b.timing?' — '+esc(b.timing):'')+'</div>').join('')+'</div></div>';else body='<div class="card"><h2>Staff</h2><p>'+esc(current.user.email)+' — '+esc(current.staff.role)+'</p></div>';setPage('<div class="row"><div><h2 class="title">'+esc(i.name)+'</h2><span class="muted">/'+esc(i.slug)+'</span></div><button id="logout" class="danger">Logout</button></div><div class="row"><button data-tab="leads">Leads</button><button data-tab="customize">Customize</button><button data-tab="catalog">Courses & batches</button><button data-tab="staff">Staff</button></div>'+body);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>renderDashboard(b.dataset.tab));document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.href='/login'};document.querySelectorAll('[data-lead]').forEach(s=>s.onchange=async()=>{const {error}=await db.from('leads').update({status:s.value,updated_at:new Date().toISOString()}).eq('id',s.dataset.lead).eq('institute_id',i.id);if(error)setMsg(error.message,'err');else renderDashboard('leads')});if(tab==='customize')document.getElementById('settings').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget));delete x.slug;const {error}=await db.from('institutes').update(x).eq('id',i.id);if(error)setMsg(error.message,'err');else{Object.assign(current.institute,x);setMsg('Settings saved.')}};if(tab==='catalog'){document.getElementById('course').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget));const {error}=await db.from('admission_courses').insert({institute_id:i.id,name:x.name});if(error)setMsg(error.message,'err');else renderDashboard('catalog')};document.getElementById('batch').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget));const {error}=await db.from('admission_batches').insert({institute_id:i.id,name:x.name,timing:x.timing||null});if(error)setMsg(error.message,'err');else renderDashboard('catalog')}}}
  async function start(){try{const r=route();if(!r)return home();if(r==='onboarding')return onboarding();if(r==='login')return login();if(r==='verify')return verify();if(r==='forgot-password')return forgot();if(r==='reset-password')return resetPassword();if(r==='dashboard')return dashboard();return publicPage(r)}catch(err){fail(err)}}
  start();
})();
</script>
</body>
</html>
