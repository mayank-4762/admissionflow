<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdmissionFlow</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#111827}.wrap{max-width:720px;margin:28px auto;padding:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;margin:14px 0}input,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #d0d5dd;font:inherit}button{background:#4f46e5;color:#fff;border:0;font-weight:700}.secondary{background:#eef2ff;color:#3730a3}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:160px}.msg{margin-top:10px}.err{color:#b42318}.ok{color:#067647}.muted{color:#667085;font-size:14px}.notice{padding:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px}a{color:#4f46e5}.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;width:auto;padding:7px 10px;margin:0;background:#eef2ff;color:#3730a3}</style></head><body><main class="wrap"><div id="app"></div></main><script>
(()=>{const URL='https://tdzqkygwrdqqpjwculmf.supabase.co',KEY='sb_publishable__ITeCtWl3mFC7sqU0JlJvA_GkFUHRXl',PKEY='admissionflow_pending_signup_v4';let db=null;const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slugify=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').replace(/-+/g,'-');const msg=(t,c='ok')=>{const e=document.getElementById('msg');if(e){e.textContent=t;e.className='msg '+c}};function init(){if(!window.supabase?.createClient)throw Error('Supabase library failed to load.');return db??=(window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}))}function shell(h){app.innerHTML='<section class="card">'+h+'</section>'}function showPw(id,b){const e=document.getElementById(id);e.type=e.type==='password'?'text':'password';b.textContent=e.type==='password'?'Show':'Hide'}
async function signup(){shell('<h1>Create your institute</h1><p class="muted">The public URL is generated from your institute name. You can change it later from Settings.</p><form id="f"><input name="name" id="name" placeholder="Institute name" minlength="2" required><div class="notice">Public URL: <b id="slug">/—</b></div><input name="email" type="email" autocomplete="email" placeholder="Owner email" required><div class="pw"><input id="pw" name="password" type="password" minlength="6" autocomplete="new-password" placeholder="Password" required><button type="button" onclick="showPw('pw',this)">Show</button></div><button id="go">Create account</button><p id="msg"></p></form><p><a href="/login">Already have an account?</a></p>');init();const f=document.getElementById('f'),n=document.getElementById('name');n.oninput=()=>document.getElementById('slug').textContent='/'+(slugify(n.value)||'—');f.onsubmit=async e=>{e.preventDefault();const b=document.getElementById('go');b.disabled=true;b.textContent='Creating account…';try{const x=Object.fromEntries(new FormData(f));localStorage.setItem(PKEY,JSON.stringify({name:x.name,email:x.email.trim().toLowerCase()}));const {data,error}=await init().auth.signUp({email:x.email.trim().toLowerCase(),password:x.password,options:{emailRedirectTo:location.origin+'/verify'}});if(error)throw error;if(data.user&&!data.session){location.href='/verify';return}if(data.session){await createInstitute(x.name);return}msg('Account created. Check your email to verify the account.','ok');}catch(e){localStorage.removeItem(PKEY);msg(e.message||String(e),'err');b.disabled=false;b.textContent='Create account'}}}
async function createInstitute(name){const {data,error}=await init().rpc('create_institute_v3',{p_name:name});if(error)throw error;localStorage.removeItem(PKEY);location.href='/dashboard'}
async function verify(){shell('<h1>Verify your email</h1><p>Open the verification email, then return here.</p><div class="row"><button id="v">I verified my email</button><button id="r" class="secondary">Resend email</button></div><p id="msg"></p><a href="/login">Back to login</a>');init();document.getElementById('v').onclick=async()=>{try{await init().auth.refreshSession();const {data:{user},error}=await init().auth.getUser();if(error)throw error;if(!user?.email_confirmed_at)return msg('Email is not verified yet.','err');const p=JSON.parse(localStorage.getItem(PKEY)||'{}');if(p.name)await createInstitute(p.name);else location.href='/dashboard'}catch(e){msg(e.message||String(e),'err')}};document.getElementById('r').onclick=async()=>{try{const p=JSON.parse(localStorage.getItem(PKEY)||'{}');if(!p.email)throw Error('No pending signup found. Start again.');const {error}=await init().auth.resend({type:'signup',email:p.email,options:{emailRedirectTo:location.origin+'/verify'}});if(error)throw error;msg('Verification email sent again.')}catch(e){msg(e.message||String(e),'err')}}}
async function login(){shell('<h1>Staff login</h1><form id="f"><input name="email" type="email" autocomplete="email" placeholder="Email" required><div class="pw"><input id="pw" name="password" type="password" autocomplete="current-password" placeholder="Password" required><button type="button" onclick="showPw(\'pw\',this)">Show</button></div><button>Login</button><p id="msg"></p></form><div class="row"><a href="/forgot-password">Forgot password?</a><a href="/onboarding">Create account</a></div>');init();document.getElementById('f').onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(e.currentTarget));const {data,error}=await init().auth.signInWithPassword({email:x.email.trim().toLowerCase(),password:x.password});if(error)throw error;if(!data.user?.email_confirmed_at)throw Error('Please verify your email first.');const {data:s,error:se}=await init().from('staff').select('institute_id').eq('user_id',data.user.id).maybeSingle();if(se)throw se;if(!s)throw Error('Your account is verified but institute setup is incomplete. Open Create your institute once to finish setup.');location.href='/dashboard'}catch(e){msg(e.message||String(e),'err')}}}
async function forgot(){shell('<h1>Reset password</h1><form id="f"><input name="email" type="email" placeholder="Email" required><button>Send reset email</button><p id="msg"></p></form><a href="/login">Back to login</a>');init();document.getElementById('f').onsubmit=async e=>{e.preventDefault();try{const email=String(new FormData(e.currentTarget).get('email')).trim().toLowerCase();const {error}=await init().auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password'});if(error)throw error;msg('Reset email sent. Check your inbox.')}catch(e){msg(e.message||String(e),'err')}}}
async function reset(){shell('<h1>Choose a new password</h1><form id="f"><div class="pw"><input id="p1" name="password" type="password" minlength="6" placeholder="New password" required><button type="button" onclick="showPw(\'p1\',this)">Show</button></div><div class="pw"><input id="p2" name="confirm" type="password" minlength="6" placeholder="Confirm password" required><button type="button" onclick="showPw(\'p2\',this)">Show</button></div><button>Update password</button><p id="msg"></p></form>');init();document.getElementById('f').onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(e.currentTarget));if(x.password!==x.confirm)throw Error('Passwords do not match.');const {error}=await init().auth.updateUser({password:x.password});if(error)throw error;msg('Password updated.');setTimeout(()=>location.href='/login',800)}catch(e){msg(e.message||String(e),'err')}}}
async function dashboard(){try{const {data:{user},error}=await init().auth.getUser();if(error||!user){location.href='/login';return}const {data:s,error:se}=await init().from('staff').select('institute_id,role').eq('user_id',user.id).maybeSingle();if(se)throw se;if(!s){shell('<h2>Setup incomplete</h2><p class="err">Your login is valid, but your institute is not linked yet.</p><a href="/onboarding">Finish institute setup</a>');return}const {data:i,error:ie}=await init().from('institutes').select('*').eq('id',s.institute_id).single();if(ie)throw ie;const {data:leads,error:lde}=await init().from('leads').select('*').eq('institute_id',i.id).order('created_at',{ascending:false}).limit(50);if(lde)throw lde;shell('<h1>'+esc(i.name)+'</h1><p class="muted">Logged in as '+esc(user.email)+'</p><div class="notice">Public URL: <b>'+location.origin+'/'+esc(i.slug)+'</b><br><a href="/'+esc(i.slug)+'" target="_blank">Open public page</a> · <a href="/settings">Settings</a></div><h2>Leads</h2>'+(leads?.length?leads.map(l=>'<div class="notice"><b>'+esc(l.student_name)+'</b> · '+esc(l.phone)+'<br><span class="muted">'+esc(l.status||'New')+' · '+esc(l.created_at)+'</span></div>').join(''):'<p class="muted">No enquiries yet.</p>')+'<button id="logout" class="secondary">Log out</button>');document.getElementById('logout').onclick=async()=>{await init().auth.signOut();location.href='/login'}}catch(e){shell('<h2>Dashboard error</h2><p class="err">'+esc(e.message||e)+'</p><a href="/login">Back to login</a>')}}
async function settings(){try{const {data:{user}}=await init().auth.getUser();if(!user){location.href='/login';return}const {data:s,error:se}=await init().from('staff').select('institute_id,role').eq('user_id',user.id).maybeSingle();if(se)throw se;if(!s){location.href='/onboarding';return}const {data:i,error:ie}=await init().from('institutes').select('name,slug,tagline').eq('id',s.institute_id).single();if(ie)throw ie;shell('<h1>Institute settings</h1><form id="f"><input id="name" name="name" value="'+esc(i.name)+'" minlength="2" required><input id="slug" name="slug" value="'+esc(i.slug)+'" minlength="2" required><div class="muted">Public URL: '+location.origin+'/ <span id="preview">'+esc(i.slug)+'</span></div><input name="tagline" value="'+esc(i.tagline||'')+'" placeholder="Tagline"><button>Save settings</button><p id="msg"></p></form><p><a href="/dashboard">Back to dashboard</a></p>');const f=document.getElementById('f');f.elements.slug.oninput=()=>document.getElementById('preview').textContent=slugify(f.elements.slug.value);f.onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(f));const {error}=await init().rpc('update_institute_v3',{p_name:x.name,p_slug:x.slug,p_tagline:x.tagline});if(error)throw error;msg('Settings saved. Your public URL is now /'+slugify(x.slug)+'.')}catch(e){msg(e.message||String(e),'err')}}}catch(e){shell('<h2>Settings error</h2><p class="err">'+esc(e.message||e)+'</p>')}}
async function start(){try{init();const p=location.pathname.replace(/^\/+|\/+$/g,'');if(p==='onboarding'||p==='signup')return signup();if(p==='verify')return verify();if(p==='login')return login();if(p==='forgot-password')return forgot();if(p==='reset-password')return reset();if(p==='dashboard')return dashboard();if(p==='settings')return settings();return login()}catch(e){shell('<h2>AdmissionFlow error</h2><p class="err">'+esc(e.message||e)+'</p>')}}window.showPw=showPw;start()})();
</script></body></html>
