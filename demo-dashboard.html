<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdmissionFlow | NorthStar Demo Dashboard</title><style>body{margin:0;background:#f5f7fb;color:#172033;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:24px;font-weight:800}.brand span{color:#2563eb}.pill{background:#dcfce7;color:#166534;border-radius:999px;padding:7px 11px;font-weight:700;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.metric,.lead{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px}.metric b{font-size:28px;display:block}.metric small{color:#64748b}.lead{margin:12px 0}.leadtop{display:flex;justify-content:space-between;gap:15px}.name{font-size:18px;font-weight:800}.status{display:inline-block;border-radius:999px;padding:5px 9px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:800}.meta{color:#64748b;margin-top:5px}.timeline{margin-top:14px;border-top:1px solid #e2e8f0;padding-top:12px;color:#334155}.ok{color:#15803d;font-weight:700}.btn{display:inline-block;padding:10px 14px;border-radius:9px;background:#172033;color:#fff;text-decoration:none;border:0;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="head"><div><div class="brand">Admission<span>Flow</span></div><div id="institute">NorthStar Academy · Automation Demo</div></div><div><span class="pill">● LIVE DEMO</span> <a class="btn" href="/demo-institute">Test enquiry</a></div></div><div class="grid"><div class="metric"><b id="count">0</b><small>Total enquiries captured</small></div><div class="metric"><b id="new">0</b><small>New leads</small></div><div class="metric"><b id="follow">0</b><small>Follow-ups created</small></div></div><h2>Admission enquiries</h2><div id="leads"><div class="lead">Loading live leads…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://tdzqkygwrdqqpjwculmf.supabase.co','sb_publishable__ITeCtWl3mFC7sqU0JlJvA_GkFUHRXl');const TOKEN='d9252ea98bd178955894c925c26699f9b45b88bd0f0230ae';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const box=document.getElementById('leads');try{const {data,error}=await db.rpc('demo_leads_v1',{p_token:TOKEN});if(error)throw error;const leads=data.leads||[];document.getElementById('count').textContent=leads.length;document.getElementById('new').textContent=leads.filter(x=>(x.status||'New')==='New').length;document.getElementById('follow').textContent=leads.filter(x=>x.follow_up_at).length;if(!leads.length){box.innerHTML='<div class="lead">No enquiries yet. Open the demo institute, submit one, then return here.</div>';return}box.innerHTML=leads.map(x=>{const follow=x.follow_up_at?new Date(x.follow_up_at).toLocaleString():'';return '<article class="lead"><div class="leadtop"><div><div class="name">'+esc(x.student_name)+'</div><div class="meta">'+esc(x.phone)+' · '+esc(x.course||'Course not specified')+' · '+esc(x.class_name||'Class not specified')+'</div></div><span class="status">'+esc(x.status||'New')+'</span></div><div class="timeline"><div class="ok">✓ Lead captured automatically</div><div class="ok">✓ Immediate counselling response simulated</div><div class="ok">✓ Follow-up task created'+(follow?' · '+esc(follow):'')+'</div></div></article>'}).join('')}catch(e){box.innerHTML='<div class="lead">Dashboard error: '+esc(e.message||e)+'</div>'}}load();setInterval(load,5000);</script></body></html>
