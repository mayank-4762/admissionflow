<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff login — AdmissionFlow</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f5f7fb;color:#111827}.wrap{max-width:520px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(16,24,40,.06)}h1{margin:0 0 8px}p{line-height:1.5;color:#667085}input,button{display:block;width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #d0d5dd;margin-top:10px;font:inherit}button{background:#4f46e5;color:#fff;border:0;font-weight:700}.secondary{background:#eef2ff;color:#3730a3}.err{color:#b42318}.ok{color:#067647}a{color:#4f46e5}</style></head>
<body><main class="wrap"><section class="card"><h1>Staff login</h1><p>Sign in to your AdmissionFlow institute dashboard.</p><form id="f"><input name="email" type="email" autocomplete="email" placeholder="Email" required><input name="password" type="password" autocomplete="current-password" placeholder="Password" required><button id="go">Login</button><p id="msg"></p></form><p><a href="/forgot-password">Forgot password?</a> · <a href="/onboarding">Create an institute</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>(()=>{const msg=document.getElementById('msg'),go=document.getElementById('go');const set=(t,c='')=>{msg.textContent=t;msg.className=c};const fail=e=>{set(e?.message||String(e),'err');go.disabled=false;go.textContent='Login'};try{if(!window.supabase?.createClient)throw Error('Authentication service could not be loaded.');const db=window.supabase.createClient('https://tdzqkygwrdqqpjwculmf.supabase.co','sb_publishable__ITeCtWl3mFC7sqU0JlJvA_GkFUHRXl',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});document.getElementById('f').onsubmit=async e=>{e.preventDefault();go.disabled=true;go.textContent='Signing in…';try{const x=Object.fromEntries(new FormData(e.currentTarget));const {data,error}=await db.auth.signInWithPassword({email:x.email.trim().toLowerCase(),password:x.password});if(error)throw error;if(!data.user?.email_confirmed_at)throw Error('Please verify your email first.');const {data:s,error:se}=await db.from('staff').select('institute_id').eq('user_id',data.user.id).maybeSingle();if(se)throw se;if(!s)throw Error('Your account is verified but institute setup is incomplete.');location.href='/dashboard'}catch(e){fail(e)}}}catch(e){fail(e)}})()</script></body></html>
